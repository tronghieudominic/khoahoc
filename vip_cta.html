        <div class="fc-i-body">
          <div class="fc-i-name"><span>${i+1}. ${esc(v.name)}</span>
            <button type="button" class="fc-speak" onclick="fcSpeak('${esc(v.audioUrl)}','${esc(v.name)}')"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <div class="fc-i-meta">${esc(v.type)} ${esc(v.spelling)}</div>
          <div class="fc-i-def">${esc(v.definition)}</div>
          ${v.imageUrl?`<img class="fc-i-img" src="${esc(v.imageUrl)}" alt="" onerror="this.style.display='none'">`:''}
        </div>
      </div>`;
    }).join('')}</div>`;
}

function renderFcQuizSetup(){
  const n=window.__fc.all.length;
  return `<div class="fc-quiz-setup">
    <h3>Thiết lập bài kiểm tra</h3>
    <div class="fc-quiz-row"><span>Câu hỏi (tối đa ${n})</span>
      <input type="number" id="fcQCount" min="1" max="${n}" value="${n}">
    </div>
    <div class="fc-quiz-row"><span>Đúng/Sai</span><label class="fc-sw"><input type="checkbox" id="fcTF" checked><span></span></label></div>
    <div class="fc-quiz-row"><span>Trắc nghiệm</span><label class="fc-sw"><input type="checkbox" id="fcMC" checked><span></span></label></div>
    <div class="fc-quiz-row"><span>Tự luận</span><label class="fc-sw"><input type="checkbox" id="fcWR" checked><span></span></label></div>
    <div class="fc-quiz-row"><span>Ghép thẻ</span><label class="fc-sw"><input type="checkbox" id="fcMT" checked><span></span></label></div>
    <button type="button" class="fc-start" onclick="fcStartQuiz()">Bắt đầu làm kiểm tra</button>
  </div>`;
}

function shuffleArr(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function pickWrongDefs(correct, all, n){
  const pool=all.filter(function(x){ return x.definition && x.definition!==correct.definition; });
  return shuffleArr(pool).slice(0,n).map(function(x){ return x.definition; });
}
function pickWrongNames(correct, all, n){
  const pool=all.filter(function(x){ return x.name && x.name!==correct.name; });
  return shuffleArr(pool).slice(0,n).map(function(x){ return x.name; });
}

window.fcStartQuiz=function(){
  const all=window.__fc.all;
  let count=parseInt((document.getElementById('fcQCount')||{}).value,10);
  if(!count||count<1) count=all.length;
  count=Math.max(1, Math.min(all.length, count));
  const types=[];
  if(document.getElementById('fcTF')?.checked) types.push('tf');
  if(document.getElementById('fcMC')?.checked) types.push('mc');
  if(document.getElementById('fcWR')?.checked) types.push('wr');
  if(document.getElementById('fcMT')?.checked) types.push('mt');
  if(!types.length){ Swal.fire({icon:'info',title:'Chọn ít nhất một dạng câu',confirmButtonColor:'#0247df'}); return; }

  // Build exactly `count` questions; match uses 1 slot for a group of pairs
  const pool=shuffleArr(all);
  const questions=[];
  let pi=0;
  while(questions.length<count && pi<pool.length*3){
    const v=pool[pi % pool.length]; pi++;
    const t=types[questions.length % types.length];
    if(t==='tf'){
      const truth=Math.random()>0.45;
      const def=truth?v.definition:(pickWrongDefs(v,all,1)[0]||v.definition);
      questions.push({type:'tf', word:v.name, prompt:'Từ <b>'+esc(v.name)+'</b> có nghĩa là “'+esc(def)+'”?', answer:truth, audio:v.audioUrl});
    }else if(t==='mc'){
      const opts=shuffleArr([v.definition].concat(pickWrongDefs(v,all,3))).slice(0,4);
      questions.push({type:'mc', word:v.name, prompt:'Nghĩa của <b>'+esc(v.name)+'</b> là gì?', options:opts, answer:v.definition, audio:v.audioUrl});
    }else if(t==='wr'){
      questions.push({type:'wr', word:v.name, prompt:'Viết nghĩa tiếng Việt của <b>'+esc(v.name)+'</b>:', answer:v.definition, audio:v.audioUrl});
    }else if(t==='mt'){
      // one match question = up to 4 pairs, counts as 1 question
      const pairs=[];
      const used={};
      for(let k=0;k<4 && pi<pool.length*2;k++){
        const w=pool[pi % pool.length]; pi++;
        if(used[w.name]) continue;
        used[w.name]=1;
        pairs.push({word:w.name, def:w.definition});
      }
      if(pairs.length>=2) questions.push({type:'mt', pairs:pairs});
      else {
        const w=pairs[0]||{word:v.name,def:v.definition};
        questions.push({type:'mc', word:w.word, prompt:'Nghĩa của <b>'+esc(w.word)+'</b>?', options:shuffleArr([w.def].concat(pickWrongDefs({definition:w.def,name:w.word},all,3))), answer:w.def});
      }
    }
  }
  window.__fcQuiz={qs:questions.slice(0,count), i:0, score:0, answered:false, playing:true};
  window.__fc.mode='quiz';
  renderFcQuizPlay();
};

function renderFcQuizPlayHTML(){
  const st=window.__fcQuiz;
  if(!st || st.i>=st.qs.length){
    const total=st?st.qs.length:0;
    const ok=st?st.score:0;
    const bad=Math.max(0, total-ok);
    return `<div class="fc-quiz-setup">
      <h3>Kết quả kiểm tra</h3>
      <p style="text-align:center;font-size:15px;color:#64748b;margin:0 0 8px">Tổng ${total} câu</p>
      <div style="display:flex;justify-content:center;gap:28px;margin:16px 0 20px">
        <div style="text-align:center"><div style="font-size:28px;font-weight:800;color:#16a34a">${ok}</div><div style="font-size:14px;color:#64748b">Đúng</div></div>
        <div style="text-align:center"><div style="font-size:28px;font-weight:800;color:#dc2626">${bad}</div><div style="font-size:14px;color:#64748b">Sai</div></div>
      </div>
      <button type="button" class="fc-start" onclick="window.__fcQuiz=null;fcSetMode('quiz')">Làm lại</button>
    </div>`;
  }
  const q=st.qs[st.i];
  let body='';
  if(q.type==='tf'){
    body=`<div class="q-prompt">${q.prompt}</div>
      <div class="q-opts">
        <button type="button" class="q-opt" onclick="fcAnswerTF(true,this)">Đúng</button>
        <button type="button" class="q-opt" onclick="fcAnswerTF(false,this)">Sai</button>
      </div>`;
  }else if(q.type==='mc'){
    body=`<div class="q-prompt">${q.prompt}</div>
      <div class="q-opts">${q.options.map(function(o){
        return `<button type="button" class="q-opt" onclick="fcAnswerMC(this)" data-val="${esc(o)}">${esc(o)}</button>`;
      }).join('')}</div>`;
  }else if(q.type==='wr'){
    body=`<div class="q-prompt">${q.prompt}</div>
      <input type="text" id="fcWrIn" placeholder="Nhập nghĩa..." onkeydown="if(event.key==='Enter')fcAnswerWR()">
      <button type="button" class="fc-start" style="margin-top:12px" onclick="fcAnswerWR()">Kiểm tra</button>`;
  }else if(q.type==='mt'){
    const left=shuffleArr(q.pairs.map(function(p){return p.word;}));
    const right=shuffleArr(q.pairs.map(function(p){return p.def;}));
    window.__fcMatch={pairs:q.pairs, sel:null, ok:0, need:q.pairs.length};
    body=`<div class="q-prompt">Ghép từ (EN) với nghĩa (VI)</div>
      <div class="fc-match" id="fcMatchBox">
        <div class="fc-match-col">${left.map(function(w){return `<button type="button" data-side="L" data-v="${esc(w)}" onclick="fcMatchClick(this)">${esc(w)}</button>`;}).join('')}</div>
        <div class="fc-match-col">${right.map(function(d){return `<button type="button" data-side="R" data-v="${esc(d)}" onclick="fcMatchClick(this)">${esc(d)}</button>`;}).join('')}</div>
      </div>`;
  }
  const done=st.i; // already answered count before current
  const ok=st.score;
  // approximate wrong among answered: answered so far = i when on question i (0-based)
  // score is correct among completed; wrong = i - score (for questions fully done)
  const wrong=Math.max(0, st.i - st.score);
  const left=Math.max(0, st.qs.length - st.i);
  return `<div class="fc-toolbar" style="justify-content:space-between">
      <div class="fc-count" style="color:#64748b">Câu ${st.i+1} / ${st.qs.length}</div>
      <div style="display:flex;gap:14px;font-size:14px;font-weight:700">
        <span style="color:#16a34a">Đúng: ${ok}</span>
        <span style="color:#dc2626">Sai: ${wrong}</span>
        <span style="color:#64748b">Còn: ${left}</span>
      </div>
    </div>
    <div class="fc-qcard">${body}</div>`;
}
function renderFcQuizPlay(){
  if(window.__fcQuiz) window.__fcQuiz.playing=true;
  renderFlashUI();
}

window.fcAnswerTF=function(val, btn){
  const st=window.__fcQuiz; if(!st||st.answered) return;
  st.answered=true;
  const q=st.qs[st.i];
  const ok=val===q.answer;
  if(ok) st.score++;
  document.querySelectorAll('.q-opt').forEach(function(b){
    const isTrue=b.textContent.trim()==='Đúng';
    if((isTrue&&q.answer)||(!isTrue&&!q.answer)) b.classList.add('correct');
    if(b===btn && !ok) b.classList.add('wrong');
  });
  setTimeout(function(){ st.i++; st.answered=false; renderFcQuizPlay(); }, 700);
};
window.fcAnswerMC=function(btn){
  const st=window.__fcQuiz; if(!st||st.answered) return;
  st.answered=true;
  const q=st.qs[st.i];
  const val=btn.getAttribute('data-val')||btn.textContent;
  const ok=val===q.answer;
  if(ok) st.score++;
  document.querySelectorAll('.q-opt').forEach(function(b){
    if((b.getAttribute('data-val')||b.textContent)===q.answer) b.classList.add('correct');
    if(b===btn && !ok) b.classList.add('wrong');
  });
  setTimeout(function(){ st.i++; st.answered=false; renderFcQuizPlay(); }, 800);
};
window.fcAnswerWR=function(){
  const st=window.__fcQuiz; if(!st||st.answered) return;
  const inp=document.getElementById('fcWrIn'); if(!inp) return;
  st.answered=true;
  const q=st.qs[st.i];
  const norm=function(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); };
  const ok=norm(inp.value)===norm(q.answer) || norm(inp.value).indexOf(norm(q.answer))>=0 || norm(q.answer).indexOf(norm(inp.value))>=0 && norm(inp.value).length>=3;
  if(ok) st.score++;
  inp.style.borderColor=ok?'#16a34a':'#dc2626';
  if(!ok) inp.value=inp.value+' → '+q.answer;
  setTimeout(function(){ st.i++; st.answered=false; renderFcQuizPlay(); }, 900);
};
window.fcMatchClick=function(btn){
  const m=window.__fcMatch; if(!m) return;
  const side=btn.getAttribute('data-side');
  const val=btn.getAttribute('data-v');
  if(btn.classList.contains('done')) return;
  if(!m.sel){
    document.querySelectorAll('#fcMatchBox button.sel').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel'); m.sel={side:side, val:val, el:btn};
    return;
  }
  if(m.sel.side===side){
    document.querySelectorAll('#fcMatchBox button.sel').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel'); m.sel={side:side, val:val, el:btn};
    return;
  }
  // check pair
  const a=m.sel.side==='L'?m.sel.val:val;
  const b=m.sel.side==='R'?m.sel.val:val;
  const ok=m.pairs.some(function(p){ return p.word===a && p.def===b; });
  if(ok){
    m.sel.el.classList.add('done'); btn.classList.add('done');
    m.sel.el.classList.remove('sel'); btn.classList.remove('sel');
    m.ok++; m.sel=null;
    if(m.ok>=m.need){
      window.__fcQuiz.score++;
      setTimeout(function(){ window.__fcQuiz.i++; window.__fcQuiz.answered=false; renderFcQuizPlay(); }, 500);
    }
  }else{
    btn.classList.add('wrong');
    m.sel.el.classList.add('wrong');
    const s=m.sel.el;
    setTimeout(function(){ btn.classList.remove('wrong','sel'); s.classList.remove('wrong','sel'); }, 400);
    m.sel=null;
  }
};


async function openCourseDoc(lessonId, name){
  // Lấy URL rồi mở tab mới — không skeleton, không ẩn trang chủ, không goHome
  try{
    const res=await api(getCourseApi()+'/course/OpenLesson/'+lessonId);
    if(!res||res._err) throw new Error('Không mở được tài liệu');
    const data=res.data||res;
    const url=data.nextUrl||data.fileUrl||data.url||'';
    if(!url) throw new Error('Chưa có liên kết tài liệu');
    const a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    if(window.Swal) Swal.fire({icon:'error',title:'Tài liệu',text:e.message||String(e),confirmButtonColor:'#0247df'});
    else alert(e.message||e);
  }
}

window.toggleDocFs=function(){
  const w=document.getElementById('docFrameWrap');
  if(!w) return;
  w.classList.toggle('fs-on');
  const on=w.classList.contains('fs-on');
  const btn=document.getElementById('docFsBtn');
  if(btn) btn.innerHTML=on?'<i class="fa-solid fa-compress"></i>':'<i class="fa-solid fa-expand"></i>';
  document.body.style.overflow=on?'hidden':'';
};
window.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const w=document.getElementById('docFrameWrap');
    if(w && w.classList.contains('fs-on')) toggleDocFs();
  }
});

function lessonFilterKind(page, type){
  const t=((page||'')+' '+(type||'')).toLowerCase();
  if(t.includes('video')||t.includes('live')) return 'video';
  if(t.includes('stest')||t.includes('test')||t.includes('exercise')) return 'test';
  if(t.includes('vocab')||t.includes('flash')) return 'vocab';
  if(t.includes('file')||t.includes('document')||t.includes('open')||t.includes('pdf')) return 'file';
  return 'other';
}
function applyCourseFilter(filter){
  document.querySelectorAll('#chFilters .ch-tab').forEach(x=>{
    x.classList.toggle('active', x.getAttribute('data-filter')===filter);
  });
  const list=document.getElementById('chList');
  if(!list) return;

  const oldFlat=list.querySelector('.ch-flat-filter');
  if(oldFlat) oldFlat.remove();

  // restore hierarchy visibility base
  list.querySelectorAll('.ch-sec, .ch-panel, .ch-flat').forEach(el=>{ el.style.display=''; });

  list.querySelectorAll('.ch-lesson').forEach(btn=>{
    const kind=btn.getAttribute('data-kind')||lessonFilterKind(btn.getAttribute('data-page'), btn.getAttribute('data-type'));
    const show = filter==='all' || kind===filter || (filter==='file' && (kind==='other'||kind==='file'));
    btn.style.display = show ? '' : 'none';
  });

  // keep panels that still have visible lessons
  list.querySelectorAll('.ch-panel').forEach(p=>{
    const any=[...p.querySelectorAll('.ch-lesson')].some(b=>b.style.display!=='none');
    p.style.display = any ? '' : 'none';
    if(any && filter!=='all') p.classList.add('open'); // expand for easier scan
  });
  list.querySelectorAll('.ch-sec').forEach(s=>{
    const any=[...s.querySelectorAll('.ch-lesson')].some(b=>b.style.display!=='none');
    s.style.display = any ? '' : 'none';
    if(any && filter!=='all') s.classList.add('open');
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('#chFilters .ch-tab').forEach(t=>{
    t.addEventListener('click',()=>applyCourseFilter(t.getAttribute('data-filter')||'all'));
  });
  loadCourseHome();
});

window.addEventListener('pagehide', function(){ if(typeof stopAllVideo==='function') stopAllVideo(true); });
window.fcKeyHandler=function(e){
  if(!window.__fc||window.__fc.mode!=='cards') return;
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)) return;
  if(e.code==='Space'||e.key===' '){
    e.preventDefault();
    fcFlipAndSpeak();
    return;
  }
  if(e.code==='ArrowRight'||e.key==='ArrowRight'){
    e.preventDefault();
    window.__fc.idx++;
    const st=document.getElementById('fcStage'); if(st) st.classList.remove('flipped');
    renderFlashUI();
    return;
  }
  if(e.code==='ArrowLeft'||e.key==='ArrowLeft'){
    e.preventDefault();
    window.__fc.idx--;
    const st=document.getElementById('fcStage'); if(st) st.classList.remove('flipped');
    renderFlashUI();
    return;
  }
};
window.addEventListener('keydown', window.fcKeyHandler);
</script>
