<style>
:root{--moon:#0247df;--hdr:56px;--plyr-color-main:#0247df;--plyr-border-radius:0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden;width:100%;max-width:100vw}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1e293b;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.mode-full{overflow:hidden}
img,video,svg{max-width:100%;height:auto}
table{max-width:100%;display:block;overflow-x:auto}
.q-card,.panel,.layout,.col-main,#contentRoot{max-width:100%}
.math-body,.q-body,.solution-box,.opt-row,.sec-inline{
  overflow-wrap:break-word;
  word-wrap:break-word;
  word-break:break-word;
  white-space:normal;
}
.opt-row{flex-wrap:wrap}
.opt-row>span:last-child{min-width:0;flex:1 1 auto}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}

.text-moon{color:var(--moon)}.bg-moon{background:var(--moon)}
.plyr{max-height:70vh;border-radius:0!important;background:#fff!important}
.plyr__video-wrapper{background:#fff!important}
mjx-container{outline:none;margin:3px 0!important}

#splash{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash.hide{opacity:0;pointer-events:none}

.sk{background:linear-gradient(90deg,#e8ecf1 25%,#f5f7fa 37%,#e8ecf1 63%);background-size:400% 100%;animation:shimmer 1.15s ease infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;font-size:15px;font-weight:500;color:#334155;cursor:pointer}
.chip:hover{background:#e8eef5}
.chip .x{color:#94a3b8;border:none;background:none;cursor:pointer;padding:0 2px;font-size:16px;line-height:1}
.chip .x:hover{color:#64748b}

.panel{background:#fff;border:1px solid #e5eaf0;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.q-card{background:#fff;border:1px solid #e5eaf0;border-radius:12px;overflow:hidden;margin-bottom:16px}
.sec-inline{color:#1f67f0;font-weight:700;font-size:16px;margin-bottom:10px;line-height:1.45}
.solution-box{background:#fff9e8;border-top:1px solid #f5e6b8;padding:16px 18px;line-height:1.6;font-size:17px;color:#333}
.opt-row{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:18px}
.opt-key{font-weight:700;min-width:1.5em}
.opt-row.correct,.opt-row.correct .opt-key{color:#16a34a}
.opt-row.correct .opt-key{font-weight:800}

.ds-table{width:100%;border-collapse:collapse;margin:8px 0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.ds-table th,.ds-table td{border:1px solid #e2e8f0;padding:10px 12px;vertical-align:middle;font-size:16px}
.ds-table th{background:#f1f5f9;font-weight:700}
.ds-table th.d{background:#059669;color:#fff;width:42px;text-align:center}
.ds-table th.s{background:#dc2626;color:#fff;width:42px;text-align:center}
.ds-table td.t{text-align:center;font-weight:700}
.ds-table td.t.y{color:#059669}.ds-table td.t.n{color:#dc2626}

.math-body img{vertical-align:middle!important;height:auto!important;max-height:1.55em!important;width:auto!important;max-width:100%!important;display:inline-block!important;cursor:zoom-in}
.math-body.ans img,.solution-box img{max-height:2em!important}
.math-body img.fig{max-height:none!important;max-width:min(100%,440px)!important;display:block!important;margin:.45em 0}

.q-body{padding:16px 18px;font-size:18px;line-height:1.55}
.meta-line{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:8px;border-top:1px solid #f1f5f9;font-size:15px}
.meta-line .ans-label{color:#1d4ed8;font-weight:700}
.meta-line .qid{color:#1e293b;font-weight:500}

.q-toolbar{display:flex;align-items:center;justify-content:space-around;padding:12px 8px;border-top:1px solid #eceff3;background:#fff}
.q-toolbar button{display:inline-flex;align-items:center;gap:7px;color:#334155;background:none;border:none;cursor:pointer;font-size:15px;font-weight:500;font-family:Roboto,sans-serif}
.q-toolbar button:hover{color:#0f172a}
.q-toolbar button i{color:#1e293b}

/* header fixed */

/* custom scrollbar */
.col-main::-webkit-scrollbar,
#answerGrid::-webkit-scrollbar{width:8px}
.col-main::-webkit-scrollbar-track,
#answerGrid::-webkit-scrollbar-track{background:transparent}
.col-main::-webkit-scrollbar-thumb,
#answerGrid::-webkit-scrollbar-thumb{background:#c5cdd8;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.col-main::-webkit-scrollbar-thumb:hover,
#answerGrid::-webkit-scrollbar-thumb:hover{background:#94a3b8;border:2px solid transparent;background-clip:padding-box}
.col-main,.col-main * ,#answerGrid{scrollbar-width:thin;scrollbar-color:#c5cdd8 transparent}

header.sticky-h{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:40;background:#fff;border-bottom:1px solid #e5eaf0}
.logo-link{cursor:pointer}

/* layout: under fixed header */
.layout{display:flex;align-items:stretch;max-width:1400px;margin:0 auto;padding:calc(var(--hdr) + 12px) 14px 16px;gap:16px;min-height:calc(100vh - var(--hdr))}
body.mode-full .layout{height:calc(100vh - var(--hdr));min-height:0;padding-top:calc(var(--hdr) + 8px);padding-bottom:8px;overflow:hidden}

.col-main{flex:1 1 0;min-width:0;max-width:820px}
body.mode-full .col-main{max-width:none;height:100%;overflow-y:auto;overflow-x:hidden;padding-right:4px;word-break:break-word}
body:not(.mode-full) .col-main{margin:0 auto}

/* right ~ half of main feel: ~420px, 18px text, own scroll */
.col-right{display:none;flex:0 0 420px;width:420px;max-width:42%;}
body.mode-full .col-right.show{display:flex;flex-direction:column;height:100%;min-height:0}
.grid-wrap{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.04);display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.grid-title{font-weight:800;font-size:16px;color:#1e293b;line-height:1.35;margin-bottom:12px;flex-shrink:0}
#answerGrid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.part-label{font-weight:700;font-size:15px;color:#0f172a;margin:12px 0 8px}
.part-label:first-of-type{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}
.g-btn{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 6px;text-align:center;font-size:16px;font-weight:500;cursor:pointer;color:#1e293b;font-family:Roboto,sans-serif;line-height:1.25}
.g-btn:hover{border-color:#3b82f6;background:#f0f7ff}
.g-row{display:flex;align-items:center;gap:8px;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff;font-size:16px}
.g-row:hover{border-color:#3b82f6;background:#f0f7ff}
.g-row .num{font-weight:700;min-width:1.3em;flex-shrink:0}
.tf-chain{display:inline-flex;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;background:#fff}
.tf-chain span{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;font-weight:600;font-size:14px;color:#334155;border-right:1px solid #cbd5e1}
.tf-chain span:last-child{border-right:none}

#imgLightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.9);align-items:center;justify-content:center}
#imgLightbox.open{display:flex}
#imgLightbox img{max-width:96vw;max-height:92vh;object-fit:contain;transition:transform .08s linear;user-select:none}

#toTop{position:fixed;right:18px;bottom:18px;z-index:50;width:48px;height:48px;border-radius:999px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 4px 14px rgba(15,23,42,.12);color:#334155;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
#toTop.show{display:flex}
#toTop:hover{color:var(--moon)}

/* mobile FAB for answer grid */
#mobGridBtn{display:none;position:fixed;right:16px;bottom:16px;z-index:55;width:52px;height:52px;border-radius:999px;background:var(--moon);color:#fff;border:none;box-shadow:0 6px 20px rgba(2,71,223,.35);align-items:center;justify-content:center;font-size:18px;cursor:pointer}
#mobSheet{display:none;position:fixed;inset:0;z-index:60}
#mobSheet.open{display:block}
#mobSheet .sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
#mobSheet .sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:78vh;background:#fff;border-radius:16px 16px 0 0;padding:12px 14px 20px;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
#mobSheet .sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;flex-shrink:0}
#mobSheet .sheet-hd .ttl{font-weight:800;font-size:15px;color:#1e293b;line-height:1.3;padding-right:8px}
#mobSheet .sheet-bd{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#mobSheet .sheet-handle{width:40px;height:4px;border-radius:4px;background:#e2e8f0;margin:0 auto 10px}

@media (max-width:980px){
  html,body{overflow-x:hidden;max-width:100vw}
  body.mode-full{overflow:auto!important;overflow-x:hidden}
  body.mode-full .layout{
    height:auto!important;
    min-height:0!important;
    overflow:visible!important;
    flex-direction:column;
    padding:calc(var(--hdr) + 10px) 10px 88px;
  }
  body.mode-full .col-main{
    height:auto!important;
    max-width:100%!important;
    overflow:visible!important;
    padding-right:0;
  }
  body.mode-full .col-right{display:none!important}
  body.mode-full #mobGridBtn{display:flex}
  body:not(.mode-full) #mobGridBtn{display:none}
  .layout{padding-left:10px;padding-right:10px}
  .g-btn{font-size:15px;padding:9px 5px}
  .g-row{font-size:15px}
  header.sticky-h .max-w-\[1400px\]{padding-left:8px;padding-right:8px}
  .q-body{font-size:16px;padding:14px}
  .opt-row{font-size:16px}
  .solution-box{font-size:15px;padding:14px}
}

@media (max-width:480px){
  :root{--hdr:52px}
  body{font-size:16px}
  .chip{font-size:13px;padding:5px 10px 5px 6px}
}
</style>

function syncClearBtn(){
  const inp=document.getElementById('idInput');
  document.getElementById('clearBtn').classList.toggle('hidden', !inp.value.trim());
}
function filterIdInput(){
  const inp=document.getElementById('idInput');
  const v=inp.value.replace(/\D/g,'');
  if(inp.value!==v) inp.value=v;
  syncClearBtn();
}
document.addEventListener('DOMContentLoaded',()=>{
  loadHistory();
  const inp=document.getElementById('idInput');
  inp.addEventListener('input',filterIdInput);
  inp.addEventListener('focus',syncClearBtn);
  inp.addEventListener('keyup',filterIdInput);
  // chặn gõ chữ/desktop paste
  inp.addEventListener('keypress',e=>{
    if(e.key==='Enter')return;
    if(e.ctrlKey||e.metaKey)return;
    if(!/^[0-9]$/.test(e.key)) e.preventDefault();
  });
  inp.addEventListener('paste',e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData('text')||'';
    const digits=t.replace(/\D/g,'');
    const start=inp.selectionStart, end=inp.selectionEnd;
    inp.value=inp.value.slice(0,start)+digits+inp.value.slice(end);
    filterIdInput();
  });
  syncClearBtn();
  const main=document.getElementById('colMain');
  main.addEventListener('scroll',()=>{
    document.getElementById('toTop').classList.toggle('show', main.scrollTop>300 || window.scrollY>400);
  },{passive:true});
  window.addEventListener('scroll',()=>{
    if(!isFull) document.getElementById('toTop').classList.toggle('show', window.scrollY>400);
  },{passive:true});
});

function headers(){return{Authorization:AUTH,Accept:'application/json',Referer:'https://moon.vn/',Origin:'https://moon.vn'};}
async function api(url){
  try{
    const r=await fetch(url,{headers:headers(),mode:'cors'});
    if(r.status===401||r.status===403)return{_err:'auth'};
    if(!r.ok)return{_err:'http'};
    return await r.json();
  }catch(e){return{_err:'net'};}
}

function setBusy(on){
  document.getElementById('skeleton').classList.toggle('hidden',!on);
  if(on){
    const empty=document.getElementById('emptyState');
    empty.classList.add('hidden');
    empty.style.display='none';
  }
  document.getElementById('searchBtn').disabled=on;
}
function clearInput(){
  const inp=document.getElementById('idInput');
  inp.value='';
  document.getElementById('clearBtn').classList.add('hidden');
  inp.focus();
}
function setModeFull(on){
  isFull=!!on;
  document.body.classList.toggle('mode-full', !!on);
  const rc=document.getElementById('rightCol');
  if(on) rc.classList.add('show'); else rc.classList.remove('show');
  // mobile: never lock page scroll
  if(window.innerWidth<=980){
    document.body.style.overflow='';
  }else if(on){
    document.body.style.overflow='hidden';
  }else{
    document.body.style.overflow='';
  }
  if(!on) closeMobSheet();
}

  const main=document.getElementById('colMain');

}

async function startFetch(custom){
  const inp=document.getElementById('idInput');
  if(custom!=null)inp.value=custom;
  syncClearBtn();
  const id=inp.value.trim();
  if(!id){Swal.fire({icon:'warning',title:'Nhập ID',confirmButtonColor:'#0247df'});return;}
  lastId=id; saveHistory(id); loadHistory();
  setBusy(true);
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('contentRoot').classList.add('hidden');
  setModeFull(false);

  try{
    const search=await api(COURSE+'/Course/SearchID/'+encodeURIComponent(id));
    if(search._err==='auth')throw new Error('Token hết hạn');
    if(!search||!search.isSuccessful||!search.id)throw new Error((search&&search.message)||'Không tìm thấy ID');
    const mod=(search.moduleName||'').toLowerCase();
    if(mod==='question') await loadSingle(id,search);
    else await loadFull(id,search);
  }catch(e){
    Swal.fire({icon:'error',title:'Lỗi',text:e.message||String(e),confirmButtonColor:'#0247df'});
    const empty=document.getElementById('emptyState');
    empty.classList.remove('hidden'); empty.style.display='flex';
    setModeFull(false);
  }finally{setBusy(false);}
}

function questionCard(o){
  const sec=o.secTitle?`<div class="sec-inline">${o.secTitle}</div>`:'';
  const order=o.showOrder&&o.order!=null?`<b>${o.order}.</b> `:'';
  let mid='';
  const t=Number(o.typeID)||0;
  const keyStr=(o.key&&String(o.key).trim())||'';
  if(t===0){
    mid=['A','B','C','D'].map(L=>{
      const h=o[L.toLowerCase()]; if(!h)return'';
      const ok=keyStr&&keyStr.toUpperCase()===L;
      return `<div class="opt-row${ok?' correct':''}"><span class="opt-key">${L}.</span><span>${h}</span></div>`;
    }).join('');
    if(mid)mid=`<div class="math-body pt-1">${mid}</div>`;
  }else if(t===2&&o.plans&&o.plans.length){
    const L=['a','b','c','d','e','f'];
    mid=`<div class="math-body pt-1"><table class="ds-table"><thead><tr><th class="d">Đ</th><th class="s">S</th><th>Mệnh đề</th></tr></thead><tbody>${
      o.plans.map((p,i)=>{const y=String(p.key)==='1';return `<tr><td class="t ${y?'y':''}">${y?'✓':''}</td><td class="t ${!y?'n':''}">${!y?'✓':''}</td><td><b>${L[i]||i+1}.</b> ${p.content||''}</td></tr>`;}).join('')
    }</tbody></table></div>`;
  }else if(t===1&&o.fillKey){
    mid=`<div class="pt-2"><span class="inline-block px-3 py-1.5 border border-blue-200 rounded-md text-blue-600 font-bold">${esc(o.fillKey)}</span></div>`;
  }
  const ansLabel=keyStr?`<span class="ans-label">Đáp án ${esc(keyStr)}</span>`:'<span></span>';
  const qid=o.bookId!=null?`<span class="qid">[${o.bookId}]</span>`:'';
  const toolbar=o.hideToolbar?'':`<div class="q-toolbar">
    <button type="button" onclick="void(0)"><i class="fa-regular fa-bookmark"></i> ${o.bookmarks||0} Save</button>
    <button type="button" onclick="void(0)"><i class="fa-regular fa-comment"></i> ${o.comments||0} Bình luận</button>
    <button type="button" ${o.isVideo?`onclick="playVideo('${o.bookId||o.idLabel}')"`:'onclick="void(0)"'}><i class="fa-solid fa-circle-play"></i> Video lời giải</button>
  </div>`;

  return `<article id="${esc(o.domId)}" class="q-card">
    <div class="q-body">
      ${sec}
      <div class="math-body">${order}${o.qText||''}</div>
      ${mid}
      <div class="meta-line">${ansLabel}${qid}</div>
    </div>
    ${o.answer?`<div class="solution-box math-body ans">${o.answer}</div>`:''}
    ${toolbar}
  </article>`;
}

async function loadSingle(bookId,search){
  setModeFull(false);
  const iid=search.id;
  const [cmsQ,itemQ,cmsV]=await Promise.all([
    api(CMS+'/course/SearchByBookID/'+encodeURIComponent(bookId)),
    api(COURSE+'/Course/ItemQuestion/'+encodeURIComponent(iid)),
    api(CMS+'/bookid/VideoDetail/'+encodeURIComponent(bookId))
  ]);
  const hasC=cmsQ&&!cmsQ._err, hasI=itemQ&&!itemQ._err&&itemQ.questionId;
  if(!hasC&&!hasI)throw new Error('Không có dữ liệu');
  let typeID=Number(search.typeID!=null?search.typeID:(hasI?itemQ.typeID:(hasC?(cmsQ.typeId??cmsQ.typeID):0)))||0;
  const pick=k=>{const a=hasC&&cmsQ[k]?String(cmsQ[k]).trim():'';const b=hasI&&itemQ[k]?String(itemQ[k]).trim():'';return a||b||'';};
  let key='';
  if(hasI&&itemQ.key&&String(itemQ.key).trim())key=String(itemQ.key).trim();
  else if(hasC&&cmsQ.key&&String(cmsQ.key).trim())key=String(cmsQ.key).trim();
  let videoUrl='';
  if(hasI&&itemQ.listTikTokVideoModel&&itemQ.listTikTokVideoModel[0])videoUrl=itemQ.listTikTokVideoModel[0].urlVideo||'';
  if(!videoUrl&&cmsV&&!cmsV._err)videoUrl=cmsV.videoUrl||'';

  const card=questionCard({
    domId:'q-single', idLabel:bookId, showOrder:false, typeID, hideToolbar:true,
    qText:(hasC&&cmsQ.questionText)||(hasI&&itemQ.questionText)||'',
    a:pick('a'),b:pick('b'),c:pick('c'),d:pick('d'),
    plans:hasI&&Array.isArray(itemQ.plans)?itemQ.plans:[],
    fillKey:String((hasI&&itemQ.fillKey)||(hasC&&cmsQ.fillKey)||'').trim(),
    answer:(hasC&&cmsQ.answer)||(hasI&&itemQ.answer)||'',
    key, bookId,
    bookmarks:hasI?itemQ.bookmarks:0, comments:hasI?itemQ.comments:0,
    isVideo:!!videoUrl||(hasI&&itemQ.isVideo)
  });
  const vid=videoUrl?`<div class="panel mt-4 overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-100 font-bold text-moon text-[16px]">Video lời giải [ID: ${esc(bookId)}]</div>
    <video id="vPlayer" playsinline class="w-full bg-white"></video>
  </div>`:'';
  const root=document.getElementById('contentRoot');
  root.innerHTML=card+vid;
  root.classList.remove('hidden');
  finish(root);
  if(videoUrl)setupVideo('vPlayer',videoUrl,true);
}

async function loadFull(bookId,search){
  const lessonId=search.id;
  const title=search.name||('Đề '+bookId);
  const [detail,readings]=await Promise.all([
    api(COURSE+'/Course/LessonDetail/'+lessonId),
    api(COURSE+'/testing/ReadingInLesson/'+lessonId)
  ]);
  if(!readings||readings._err||!Array.isArray(readings))throw new Error('Không tải được đề');

  const uniq=[];
  readings.forEach(s=>(s.listQuestion||[]).forEach(q=>{if(q.bookId)uniq.push(q.bookId);}));
  const ids=[...new Set(uniq)];
  const cmsMap={};
  await mapPool(ids,6,async bid=>{
    const c=await api(CMS+'/course/SearchByBookID/'+encodeURIComponent(bid));
    if(c&&!c._err)cmsMap[bid]=c;
  });
  readings.forEach(sec=>{
    (sec.listQuestion||[]).forEach(q=>{
      const c=cmsMap[q.bookId]; if(!c)return;
      if(c.questionText)q.questionText=c.questionText;
      if(c.answer)q.answer=c.answer;
      ['a','b','c','d'].forEach(k=>{if(c[k]&&String(c[k]).trim())q[k]=c[k];});
      if(c.key&&String(c.key).trim())q.key=c.key;
      if(c.fillKey)q.fillKey=c.fillKey;
    });
  });

  const keys={};
  ((detail&&!detail._err&&detail.keyAllEnglish)||[]).forEach(k=>{keys[k.questionId]=k.key;});

  let html='';
  (readings||[]).forEach((sec,si)=>{
    const part=si+1;
    const sc=sec.questionScore!=null?sec.questionScore:'';
    const secTitle=`${esc(sec.title||('Phần '+part))}${sc!==''?` <span style="color:#ef4444">(${sc} điểm)</span>`:''}`;
    (sec.listQuestion||[]).forEach((q,qi)=>{
      const ansKey=(q.key&&String(q.key).trim())||keys[q.questionId]||'';
      const domId='q-p'+part+'-'+q.order+'-'+(q.questionId||q.bookId||'x');
      html+=questionCard({
        domId, idLabel:q.bookId||q.questionId, order:q.order, showOrder:true, typeID:q.typeId,
        qText:q.questionText||'', a:q.a,b:q.b,c:q.c,d:q.d,
        plans:q.plans||[], fillKey:(q.fillKey||'').trim(),
        answer:q.answer||'', key:ansKey, bookId:q.bookId||q.questionId,
        bookmarks:q.bookmarks, comments:q.comments, isVideo:q.isVideo,
        secTitle: qi===0 ? secTitle : ''
      });
    });
  });
  const root=document.getElementById('contentRoot');
  root.innerHTML=html;
  root.classList.remove('hidden');
  renderGrid(readings,keys,title);
  setModeFull(true);
  finish(root);
  document.getElementById('colMain').scrollTop=0;
}

async function mapPool(arr,limit,fn){
  let i=0; async function w(){while(i<arr.length){const c=i++;await fn(arr[c]);}}
  await Promise.all(Array.from({length:Math.min(limit,arr.length||1)},()=>w()));
}

function mcCols(n){
  if(n<=12)return 2;
  if(n<=24)return 3;
  return 4;
}

function openMobSheet(){document.getElementById('mobSheet').classList.add('open');document.body.style.overflow='hidden';}
function closeMobSheet(){document.getElementById('mobSheet').classList.remove('open');if(!document.body.classList.contains('mode-full')||window.innerWidth<=980){document.body.style.overflow='';}else{document.body.style.overflow='hidden';}}
function renderGrid(readings,keys,title){
  const ttl=title||'Đáp án nhanh';
  document.getElementById('gridTitle').textContent=ttl;
  const mt=document.getElementById('mobGridTitle'); if(mt) mt.textContent=ttl;
  let html='',p=0;
  (readings||[]).forEach(sec=>{
    p++; const qs=sec.listQuestion||[]; if(!qs.length)return;
    const t=qs[0].typeId;
    html+=`<div class="part-label">Phần ${p}</div>`;
    if(t===0){
      const cols=mcCols(qs.length);
      const gcls=cols===2?'g2':(cols===3?'g3':'g4');
      html+=`<div class="${gcls}">`;
      qs.forEach(q=>{
        const k=(q.key&&String(q.key).trim())||keys[q.questionId]||'-';
        const domId='q-p'+p+'-'+q.order+'-'+(q.questionId||q.bookId||'x');
        html+=`<button type="button" class="g-btn" onclick="goQ('${domId}')">${q.order}. ${k}</button>`;
      });
      html+=`</div>`;
    }else if(t===2){
      html+=`<div class="g2">`;
      qs.forEach(q=>{
        const boxes=(q.plans||[]).map(x=>`<span>${String(x.key)==='1'?'Đ':'S'}</span>`).join('');
        const domId='q-p'+p+'-'+q.order+'-'+(q.questionId||q.bookId||'x');
        html+=`<div class="g-row" onclick="goQ('${domId}')"><span class="num">${q.order}</span><span class="tf-chain">${boxes}</span></div>`;
      });
      html+=`</div>`;
    }else if(t===1){
      html+=`<div class="g2">`;
      qs.forEach(q=>{
        const domId='q-p'+p+'-'+q.order+'-'+(q.questionId||q.bookId||'x');
        html+=`<div class="g-row" onclick="goQ('${domId}')"><span class="num">${q.order}</span><span style="font-weight:600">${esc((q.fillKey||'').trim()||'-')}</span></div>`;
      });
      html+=`</div>`;
    }else{
      html+=`<div class="g2">`;
      qs.forEach(q=>{
        const domId='q-p'+p+'-'+q.order+'-'+(q.questionId||q.bookId||'x');
        html+=`<button type="button" class="g-btn" onclick="goQ('${domId}')">${q.order}</button>`;
      });
      html+=`</div>`;
    }
  });
  document.getElementById('answerGrid').innerHTML=html;
  const mob=document.getElementById('mobAnswerGrid');
  if(mob) mob.innerHTML=html;
}
function goQ(id){
  const el=document.getElementById(id);
  if(!el)return;
  closeMobSheet();
  const mobile=window.innerWidth<=980;
  if(isFull && !mobile){
    const main=document.getElementById('colMain');
    const top=el.offsetTop - 8;
    main.scrollTo({top:Math.max(0,top),behavior:'smooth'});
  }else{
    el.scrollIntoView({behavior:'smooth',block:'start'});
  }
  el.classList.add('ring-2','ring-blue-400');
  setTimeout(()=>el.classList.remove('ring-2','ring-blue-400'),800);
}

async function playVideo(bookId){
  let url='';
  const s=await api(COURSE+'/Course/SearchID/'+encodeURIComponent(bookId));
  if(s&&s.id){const iq=await api(COURSE+'/Course/ItemQuestion/'+s.id);if(iq&&iq.listTikTokVideoModel&&iq.listTikTokVideoModel[0])url=iq.listTikTokVideoModel[0].urlVideo||'';}
  if(!url){const v=await api(CMS+'/bookid/VideoDetail/'+encodeURIComponent(bookId));if(v&&!v._err)url=v.videoUrl||'';}
  if(!url){Swal.fire({icon:'info',title:'Chưa có video',confirmButtonColor:'#0247df'});return;}
  let ov=document.getElementById('vidOv');
  if(ov)ov.remove();
  ov=document.createElement('div');ov.id='vidOv';
  ov.className='fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4';
  ov.innerHTML=`<div class="bg-white w-full max-w-3xl rounded-xl overflow-hidden shadow-xl">
    <div class="flex justify-between items-center px-4 py-3 border-b">
      <span class="font-bold text-moon text-[16px]">Video lời giải [ID: ${esc(bookId)}]</span>
      <button type="button" class="text-2xl text-slate-500 px-2 leading-none" onclick="document.getElementById('vidOv').remove()">&times;</button>
    </div>
    <video id="ovPlayer" playsinline class="w-full bg-white"></video>
  </div>`;
  document.body.appendChild(ov);
  setupVideo('ovPlayer',url,true);
}
function setupVideo(id,url,autoplay){
  const video=document.getElementById(id); if(!video)return;
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  const tryPlay=()=>{ if(autoplay) video.play().catch(()=>{}); };
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
    if(!video._plyr)video._plyr=new Plyr(video,{controls:['play-large','play','progress','current-time','duration','mute','volume','fullscreen'],autoplay:!!autoplay});
  }else{
    video.src=url;
    video.addEventListener('loadeddata',tryPlay,{once:true});
  }
}

function finish(root){
  const empty=document.getElementById('emptyState');
  empty.classList.add('hidden');
  empty.style.display='none';
  document.getElementById('skeleton').classList.add('hidden');
  document.getElementById('contentRoot').classList.remove('hidden');
  if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([root]).catch(()=>{});
  requestAnimationFrame(()=>{normImg(root);bindZoom(root);});
}
function normImg(root){
  if(!root)return;
  root.querySelectorAll('img').forEach(img=>{
    img.style.height='';img.removeAttribute('height');
    const s=(img.getAttribute('src')||'').toLowerCase();
    if(s.includes('latex')){img.style.maxHeight=img.closest('.solution-box, .ans')?'2em':'1.55em';img.style.display='inline-block';img.style.verticalAlign='middle';img.classList.remove('fig');}
    else{img.classList.add('fig');img.style.maxHeight='none';img.style.maxWidth='min(100%,440px)';img.style.display='block';}
    img.onerror=function(){this.style.display='none';};
  });
}
function bindZoom(root){
  if(!root)return;
  root.querySelectorAll('img').forEach(img=>{
    if(img.dataset.z)return;img.dataset.z='1';
    img.addEventListener('click',e=>{e.preventDefault();openLb(img.src);});
  });
}
function openLb(src){lbScale=1;const im=document.getElementById('lbImg');im.src=src;im.style.transform='scale(1)';document.getElementById('imgLightbox').classList.add('open');}
function closeLb(){document.getElementById('imgLightbox').classList.remove('open');}
document.getElementById('imgLightbox').addEventListener('click',e=>{if(e.target.id==='imgLightbox')closeLb();});
document.getElementById('imgLightbox').addEventListener('wheel',e=>{e.preventDefault();lbScale=Math.min(5,Math.max(0.35,lbScale+(e.deltaY<0?0.12:-0.12)));document.getElementById('lbImg').style.transform='scale('+lbScale+')';},{passive:false});

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function saveHistory(id){let h=JSON.parse(localStorage.getItem('moon_u_hist')||'[]').filter(x=>x!==id);h.unshift(id);if(h.length>24)h=h.slice(0,24);localStorage.setItem('moon_u_hist',JSON.stringify(h));}
function loadHistory(){
  const h=JSON.parse(localStorage.getItem('moon_u_hist')||'[]');
  const box=document.getElementById('historyBox');
  const tags=document.getElementById('historyTags');
  if(!h.length){box.classList.add('hidden');return;}
  box.classList.remove('hidden');
  tags.innerHTML=h.map(id=>`<div class="chip" onclick="startFetch('${id}')">
    <span class="w-7 h-7 rounded-full bg-white flex items-center justify-center shadow-sm"><i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i></span>
    <span>ID ${id}</span>
    <button type="button" class="x" onclick="event.stopPropagation();rmHist('${id}')">&times;</button>
  </div>`).join('');
}
function rmHist(id){localStorage.setItem('moon_u_hist',JSON.stringify(JSON.parse(localStorage.getItem('moon_u_hist')||'[]').filter(x=>x!==id)));loadHistory();}
function clearHistory(){localStorage.removeItem('moon_u_hist');loadHistory();}

window.addEventListener('resize',()=>{
  if(isFull) setModeFull(true);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLb();closeMobSheet();}});
</script>
