<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="https://d21acfi38wn3iy.cloudfront.net/resource/documents/fd3ced5d-236b-4594-9969-de8c644bf4d7/1786630765679-favicon-png.png">
<title>Khoá học - Dominic</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css" />
<script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Roboto', 'Segoe UI', Arial, sans-serif; font-size: 14.5px; background: #F5F7FB; color: #0F172A; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ===== Thanh tiến trình tải trang ===== */
.top-progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, #3B8FC4, #A8D4EC); z-index: 100000; opacity: 0; transition: opacity .25s ease; box-shadow: 0 0 10px rgba(59, 143, 196, .55); }
.top-progress.active { opacity: 1; }
.top-progress.finish { transition: width .25s ease, opacity .4s ease .15s; }

/* ===== Khung ứng dụng ===== */
.app { display: flex; height: 100vh; position: relative; }
.app.catalog-mode .sidebar { display: none; }
.app.catalog-mode .icon-btn[title="Danh sách bài học"] { display: none; }
.sb-backdrop { display: none; position: fixed; inset: 0; background: rgba(15, 20, 35, .45); z-index: 41; opacity: 0; transition: opacity .25s ease; }
.sb-backdrop.show { display: block; opacity: 1; }

/* ===== Sidebar (cây bài học) ===== */
.sidebar { width: 360px; min-width: 300px; background: #fff; border-right: 1px solid #E8ECF1; display: flex; flex-direction: column; overflow: hidden; transition: width .3s cubic-bezier(.4,0,.2,1); flex-shrink: 0; }
.sidebar.collapsed { width: 0; min-width: 0; border-right-color: transparent; }
.sb-head { padding: 16px 18px 18px; background: #3B8FC4; color: #fff; flex-shrink: 0; }
.sb-head h2 { font-size: 15px; font-weight: 700; line-height: 1.4; white-space: normal; overflow: visible; text-overflow: clip; letter-spacing: -0.01em; }
.sb-head p { font-size: 12.5px; opacity: .85; margin-top: 3px; }
.sb-back { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border: none; color: #fff; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 20px; cursor: pointer; margin-bottom: 10px; font-family: inherit; transition: background .15s; }
.sb-back:hover { background: rgba(255,255,255,.28); }
.sb-back svg { width: 14px; height: 14px; }
#sb-tag.sb-tag-back, #sb-tag.sb-tag-back:empty { display: none; }
#sb-tag.sb-tag-back:not(:empty) {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  background: rgba(255,255,255,.16); border: none; color: #fff; font-size: 12.5px; font-weight: 600;
  padding: 5px 10px; border-radius: 20px; cursor: pointer; font-family: inherit;
}
#sb-tag.sb-tag-back:hover { background: rgba(255,255,255,.28); }
.sb-search { padding: 12px 14px; border-bottom: 1px solid #F1F5F9; flex-shrink: 0; }
.sb-search input { width: 100%; padding: 10px 14px; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 13.5px; font-family: inherit; background: #F8FAFC; outline: none; transition: border-color .15s, background .15s, box-shadow .15s; }
.sb-search input:focus { border-color: #3B8FC4; background: #fff; box-shadow: 0 0 0 3px rgba(59,143,196,.12); }

/* Cây bài học — dịu, ít bo góc, ít đường line; line chỉ ở nhóm bài con */
.sb-body { overflow-y: auto; flex: 1; padding: 6px 8px 18px; }
.tree-node { position: relative; }
.tree-node + .tree-node { margin-top: 2px; }

.folder-hd {
  min-height: 46px;
  padding: 11px 12px;
  font-size: 15px; font-weight: 700; color: #0F172A;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  user-select: none; border-radius: 6px;
  transition: background .15s ease;
  background: #F0F2F5;
  line-height: 1.4;
}
.folder-hd > span:first-child { flex: 1; min-width: 0; }
.folder-hd:hover { background: #E6E9EF; }
.folder-hd.open { background: #E8EAEE; }
.folder-hd .ch {
  width: 16px; height: 16px; flex-shrink: 0; color: #94A3B8;
  transition: transform .2s ease, color .15s;
}
.folder-hd.open .ch { transform: rotate(90deg); color: #64748B; }

/* Chương lớn: chữ to, nền xám nhẹ */
.lvl1-hd {
  font-size: 15.5px; font-weight: 700; color: #0F172A;
  background: #F0F2F5; padding: 13px 12px; min-height: 50px;
}
.lvl1-hd:hover, .lvl1-hd.open { background: #E6E9EF; }

/* Chương con: nền trắng, không viền */
.lvl2-hd, .lvl3-hd, .lvl4-hd, .lvl5-hd {
  background: #fff;
  font-weight: 600;
  min-height: 44px;
  padding: 10px 12px;
  border-radius: 6px;
}
.lvl2-hd { font-size: 14.5px; color: #1E293B; }
.lvl3-hd, .lvl4-hd, .lvl5-hd { font-size: 14px; color: #334155; }
.lvl2-hd:hover, .lvl3-hd:hover, .lvl4-hd:hover, .lvl5-hd:hover,
.lvl2-hd.open, .lvl3-hd.open, .lvl4-hd.open, .lvl5-hd.open {
  background: #F5F6F8;
}

/* Nhóm con: indent nhẹ; chỉ vẽ đường dọc khi chứa leaf (bài giảng) */
.kids {
  display: none; position: relative;
  margin: 0 0 2px 8px;
  padding: 2px 0 2px 10px;
  border-left: none;
}
.kids.open { display: block; }
.kids.has-leaves {
  margin-left: 14px;
  padding-left: 12px;
  border-left: 1.5px solid #E2E5EB;
}

/* Bài học — vùng bấm lớn, không viền, bo góc nhẹ */
.leaf {
  min-height: 42px;
  padding: 9px 8px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  line-height: 1.4; color: #334155;
  border-radius: 6px;
  background: transparent;
  transition: background .12s ease, color .12s ease;
  margin-bottom: 1px;
}
.leaf:hover { background: #F1F3F6; color: #0F172A; }
.leaf.active {
  background: #E8F4FC;
  font-weight: 600;
  color: #256B96;
}
.leaf:active { background: #DFF0FA; }

/* Icon theo loại — không khung tròn, kích cỡ vừa chữ */
.leaf-badge {
  flex-shrink: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: 0;
  color: #64748B;
}
.leaf-badge svg { width: 18px; height: 18px; display: block; }
.leaf-badge.video { color: #5B9BC9; }
.leaf-badge.pdf { color: #E07A7A; }
.leaf-badge.embedded { color: #6BBF8A; }
.leaf-badge.link { color: #6BBF8A; }
.leaf-badge.test { color: #D4A35C; }
.leaf-badge.listening-test { color: #9B8AD6; }
.leaf-badge.reading-test { color: #C4A574; }
.leaf-badge.flashcard { color: #D48AB0; }
.leaf-badge.other { color: #8B95A5; }

.leaf-title {
  flex: 1; min-width: 0;
  overflow: visible; text-overflow: clip; white-space: normal;
  line-height: 1.4; font-size: 14px;
}
.leaf.active .leaf-title { color: #256B96; }

/* Trạng thái trống / đang tải: căn giữa cả về chiều dọc thay vì dồn lên đầu panel, có icon minh hoạ. */
.sb-body .state, .sb-body .err { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 100%; padding: 40px 24px; text-align: center; color: #94A3B8; }
.sb-body .state svg, .sb-body .err svg { width: 40px; height: 40px; color: #c6cee0; }
.sb-body .state p, .sb-body .err p { font-size: 13.5px; line-height: 1.5; }

/* ===== Khu vực chính ===== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar { height: 56px; background: #fff; border-bottom: 1px solid #E8ECF1; display: flex; align-items: center; padding: 0 20px; gap: 10px; flex-shrink: 0; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 10px; color: #3B8FC4; display: flex; align-items: center; flex-shrink: 0; transition: background .12s; }
.icon-btn:hover { background: #F2F8FC; }
.top-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.4; color: #0F172A; letter-spacing: -0.01em; }
.breadcrumb { display:flex; align-items:center; gap:8px; flex:1; min-width:0; flex-wrap:wrap; }
.breadcrumb-home { border:0; background:none; padding:4px 0; color:#3B8FC4; font:600 13.5px/1.3 inherit; cursor:pointer; }
.breadcrumb-sep { color:#94A3B8; font-size:18px; }
.breadcrumb .top-title { flex:0 1 auto; max-width:none; }
.breadcrumb-course { color:#64748B; font-weight:600; }

.btn-support { background: #3B8FC4; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: none; align-items: center; gap: 5px; font-family: inherit; transition: background .15s, box-shadow .15s; box-shadow: 0 1px 2px rgba(59,143,196,.2); height: 34px; box-sizing: border-box; }
.btn-support:hover { background: #2F7AAB; box-shadow: 0 2px 8px rgba(59,143,196,.3); }
.btn-support svg { width: 15px; height: 15px; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; background: #F5F7FB; }
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 220px; gap: 14px; color: #94A3B8; text-align: center; flex: 1; }
.state p { font-size: 15px; line-height: 1.6; }
.spinner { width: 36px; height: 36px; border: 4px solid #E2E8F0; border-top-color: #3B8FC4; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Trang chủ / Danh mục khoá học (mới) ===== */
.hero { background: linear-gradient(135deg, #3B8FC4 0%, #7EB8D9 100%); color: #fff; border-radius: 18px; padding: 28px 28px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(59,143,196,.18); }
.hero h1 { font-size: 21px; font-weight: 700; }
.hero p { font-size: 14px; opacity: .92; line-height: 1.55; max-width: 640px; }
.section-title { font-size: 15.5px; font-weight: 700; color: #0F172A; margin-top: 6px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
.section-title svg { width: 18px; height: 18px; color: #3B8FC4; }

.teacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.teacher-card { background: #fff; border: 1px solid #E8ECF1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; box-shadow: 0 1px 3px rgba(15,23,42,.04); }
.teacher-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(59, 143, 196, .12); border-color: #C5DFF0; }
.teacher-card .avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: #F2F8FC; border: 3px solid #F2F8FC; }
.teacher-card .avatar.placeholder { display: flex; align-items: center; justify-content: center; color: #3B8FC4; font-size: 26px; font-weight: 700; }
.teacher-card h3 { font-size: 15.5px; font-weight: 700; color: #0F172A; }
.teacher-card .subject-tag { font-size: 12.5px; font-weight: 600; color: #3B8FC4; background: #F2F8FC; padding: 3px 12px; border-radius: 20px; }
.teacher-card .bio { font-size: 12.5px; color: #94A3B8; line-height: 1.5; max-height: 54px; overflow: hidden; }
.teacher-card .cta { font-size: 13px; font-weight: 600; color: #3B8FC4; display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.teacher-card .cta svg { width: 14px; height: 14px; transition: transform .15s; }
.teacher-card:hover .cta svg { transform: translateX(3px); }

.catalog-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.catalog-search { flex: 1; min-width: 180px; max-width: 320px; }
.catalog-search input { width: 100%; padding: 9px 14px; border: 1px solid #CBD5E1; border-radius: 20px; font-size: 14px; font-family: inherit; background: #fff; outline: none; }
.catalog-search input:focus { border-color: #3B8FC4; }
.cat-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-pill { border: 1px solid #E2E8F0; background: #fff; color: #64748B; font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background .15s, color .15s, border-color .15s, box-shadow .15s; }
.cat-pill:hover { border-color: #3B8FC4; color: #3B8FC4; }
.cat-pill.active { background: #3B8FC4; border-color: #3B8FC4; color: #fff; box-shadow: 0 2px 8px rgba(59,143,196,.25); }

.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.course-card { background: #fff; border: 1px solid #E8ECF1; border-radius: 16px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s; box-shadow: 0 1px 3px rgba(15,23,42,.04); }
.course-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(59, 143, 196, .14); }
.course-card .thumb { width: 100%; aspect-ratio: 16/10; background: linear-gradient(135deg, #3B8FC4, #A8D4EC); object-fit: cover; display: block; }
.course-card .thumb-fallback { width: 100%; aspect-ratio: 16/10; background: linear-gradient(135deg, #3B8FC4, #A8D4EC); display: flex; align-items: center; justify-content: center; color: #fff; }
.course-card .thumb-fallback svg { width: 34px; height: 34px; opacity: .85; }
.course-card .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.course-card .cat-tag { font-size: 11.5px; font-weight: 700; color: #3B8FC4; text-transform: uppercase; letter-spacing: .3px; }
.course-card h4 { font-size: 14.5px; font-weight: 700; color: #0F172A; line-height: 1.4; }
.course-card .sub { font-size: 12.5px; color: #94A3B8; }
.course-card .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.chip.free { background: #e8f8ee; color: #1a7a40; }
.chip.price { background: #fff4e0; color: #a15c00; }
.chip.featured { background: #fdeef0; color: #c0392b; }
.chip.students { background: #F2F8FC; color: #3B8FC4; }

.err { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 12px; padding: 16px 20px; color: #B91C1C; font-size: 14.5px; line-height: 1.6; font-weight: 500; }
.backup-box { background: #fffde6; border: 1px solid #e6db55; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: #665e00; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn-refresh { background: #3B8FC4; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

/* ===== Modal hỗ trợ bài học ===== */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, .55); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all .25s ease; }
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal-box { background: #fff; width: 92%; max-width: 480px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(15, 23, 42, .16); transform: translateY(-12px); transition: transform .25s ease; }
.modal-overlay.show .modal-box { transform: translateY(0); }
.modal-head { display: none; }
.modal-body { padding: 22px 22px 12px; overflow-y: auto; }
.modal-section-label { font-size: 14px; font-weight: 600; color: #0F172A; text-transform: none; letter-spacing: 0; margin: 14px 0 8px; }
.modal-section-label:first-of-type { margin-top: 0; }
.modal-footer { padding: 8px 22px 18px; display: flex; justify-content: flex-end; }
.modal-close-btn { background: #3B8FC4; color: #fff; border: none; padding: 9px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.modal-close-btn:hover { background: #2F7AAB; }
.attach-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #F7F8FA; border-radius: 8px; border: 1px solid #E8ECF1; margin-bottom: 8px; text-decoration: none; color: inherit; cursor: pointer; transition: background .15s, border-color .15s; max-width: 100%; box-sizing: border-box; }
a.attach-row:hover { background: #EEF2F7; border-color: #C5DFF0; }
.attach-row .att-icon { color: #3B8FC4; flex-shrink: 0; display: flex; }
.attach-row .att-name { flex: 1; min-width: 0; font-size: 13.5px; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.attach-row .att-dl { color: #3B8FC4; font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; pointer-events: none; flex-shrink: 0; }
.lesson-below { margin-top: 14px; }
.lesson-below .desc-html { font-size: 14.5px; line-height: 1.65; color: #334155; }
.lesson-section, .exam-landing { max-width: 100%; overflow-x: hidden; box-sizing: border-box; }
@media (max-width: 860px) {
  .top-title, .topbar-title-only { -webkit-line-clamp: 1 !important; }
  .lesson-below { margin-top: 12px; }
  .attach-row .att-dl { display: none; }
  .attach-row .att-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .exam-info-card, .lesson-section { overflow: hidden; }
}

.modal-desc { font-size: 14.5px; line-height: 1.65; color: #334155; margin-bottom: 4px; }
.modal-desc p { margin-bottom: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; color: #94A3B8; margin-bottom: 16px; }
.meta span { display: flex; align-items: center; gap: 5px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.badge.video { background: #F2F8FC; color: #3B8FC4; }
.badge.pdf { background: #fff0f0; color: #c0392b; }
.badge.embedded { background: #e8f8ee; color: #1a7a40; }
.badge.test { background: #fff6e0; color: #a4700a; }
.badge.listening-test { background: #f2ecff; color: #6b3fc7; }
.badge.reading-test { background: #e6f7f5; color: #0e7d70; }
.badge.flashcard { background: #fdeef7; color: #b23a86; }
.badge.other { background: #f0f0f0; color: #555; }
.attach-inline { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.attach-btn { display: none; }
.attach-btn:hover { }
.desc-html { font-size: 15px; line-height: 1.7; color: #1E293B; }
.desc-html p { margin-bottom: 8px; }

/* ===== Trình phát video / PDF ===== */
.viewer-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #E2E8F0; background: #000; width: 100%; }
.viewer-wrap.dark { border: none; aspect-ratio: 16/9; max-height: 85vh; background: #0a0a0a; }
.viewer-wrap.dark .plyr:not(.plyr--fullscreen-active),
.viewer-wrap .plyr:not(.plyr--fullscreen-active) { width: 100%; height: 100%; aspect-ratio: 16/9; max-height: 85vh; border-radius: 10px; overflow: hidden; }
.viewer-wrap.dark > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.viewer-wrap video { width: 100%; height: 100%; object-fit: contain; display: block; }
.viewer-wrap iframe { width: 100%; height: 82dvh; border: none; display: block; background: #F5F7FB; }
.viewer-wrap:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; background: #000; }
.viewer-wrap:fullscreen iframe { height: 100vh !important; width: 100vw !important; }
.fs-btn { position: absolute; bottom: 12px; right: 12px; background: rgba(0, 0, 0, .75); border: none; border-radius: 50%; color: #fff; cursor: pointer; padding: 10px; font-size: 13px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; z-index: 999; transition: background .15s; width: 36px; height: 36px; }
.fs-btn:hover { background: rgba(0, 0, 0, .95); }
.notice-box { border-radius: 14px; padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
.notice-box svg { flex-shrink: 0; width: 26px; height: 26px; margin-top: 2px; }

.pdf-control-bar { height: 46px; background: #3B8FC4; color: #fff; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 14px; font-size: 13.5px; flex-shrink: 0; user-select: none; }
.pdf-btn { background: rgba(255, 255, 255, .1); border: none; color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: background .15s; text-decoration: none; }
.pdf-btn svg { width: 16px; height: 16px; }
.pdf-btn:hover { background: rgba(255, 255, 255, .25); }
.pdf-btn:disabled { opacity: .4; cursor: not-allowed; }
.pdf-canvas-container { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background: #64748b; scroll-behavior: smooth; }
.pdf-canvas-container canvas { box-shadow: 0 8px 24px rgba(0, 0, 0, .25); background: #fff; max-width: 100%; border-radius: 2px; }
.pdf-doc-switch { display: flex; gap: 4px; background: rgba(255, 255, 255, .12); border-radius: 6px; padding: 2px; max-width: 260px; overflow-x: auto; }
.pdf-doc-btn { background: transparent; border: none; color: #dbe9f5; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12.5px; font-weight: 500; font-family: inherit; white-space: nowrap; transition: background .15s, color .15s; }
.pdf-doc-btn.active { background: #fff; color: #3B8FC4; }
.pdf-doc-btn:not(.active):hover { background: rgba(255, 255, 255, .18); }
.pdf-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.pdf-thumb-rail { width: 92px; flex-shrink: 0; background: #4b5a72; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 8px; }
.pdf-thumb-item { width: 100%; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: .75; transition: opacity .15s; }
.pdf-thumb-item:hover { opacity: 1; }
.pdf-thumb-item.active { opacity: 1; }
.pdf-thumb-canvas-wrap { width: 100%; min-height: 46px; background: #fff; border-radius: 3px; border: 2px solid transparent; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); overflow: hidden; }
.pdf-thumb-item.active .pdf-thumb-canvas-wrap { border-color: #A8D4EC; }
.pdf-thumb-canvas-wrap canvas { display: block; width: 100%; height: auto; }
.pdf-thumb-item span { font-size: 10.5px; color: #dbe9f5; font-weight: 600; }
.pdf-scroll-list { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
.pdf-scroll-page { position: relative; background: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); border-radius: 2px; max-width: 100%; }
.pdf-scroll-page canvas { display: block; max-width: 100%; height: auto; }
.pdf-scroll-page .pg-num { position: absolute; bottom: 8px; right: 10px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.pdf-scroll-page.placeholder { display: flex; align-items: center; justify-content: center; color: #a8b5c8; font-size: 13px; min-height: 280px; width: 100%; max-width: 640px; }
.viewer-wrap:focus { outline: none; }
.video-kbd-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.85); display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(0, 0, 0, .68); color: #fff; padding: 16px 22px; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity .2s ease, transform .2s ease; z-index: 20; backdrop-filter: blur(2px); }
.video-kbd-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.video-kbd-overlay .vko-icon { width: 34px; height: 34px; }
.video-kbd-overlay .vko-icon svg { width: 100%; height: 100%; }
.video-kbd-overlay .vko-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.viewer-wrap .plyr {
  --plyr-color-main: #3B8FC4;
  --plyr-video-control-color: #ffffff;
  --plyr-video-control-color-hover: #ffffff;
  --plyr-video-control-bg-hover: rgba(255, 71, 87, .2);
  --plyr-tooltip-background: #ffffff;
  --plyr-tooltip-color: #64748B;
  --plyr-tooltip-radius: 6px;
}
.viewer-wrap .plyr .plyr__tooltip {
  font-size: 13px;
  font-weight: 600;
  color: #64748B;
  background: #fff;
  padding: 5px 10px;
  line-height: 1.3;
}

/* ===== Thanh điều hướng dưới cùng - trải nghiệm kiểu app trên di động ===== */
.bottom-nav { display: none; }

/* ===== Giao diện di động - ưu tiên trải nghiệm kiểu app ===== */

  .topbar { padding: 0 10px; gap: 6px; }
  .top-title { font-size: 14px; }
  .btn-support { padding: 0; width: 34px; height: 34px; font-size: 0; gap: 0; justify-content: center; }
  .btn-support svg { width: 15px; height: 15px; margin: 0; }
  .content { padding: 12px; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .modal-box { width: 94%; max-height: 90vh; }
  .pdf-control-bar { gap: 8px; flex-wrap: wrap; height: auto; padding: 8px 10px; }
  .pdf-canvas-container { padding: 10px; }
  .pdf-doc-switch { max-width: 150px; }
  .pdf-thumb-rail { position: fixed; top: 0; bottom: 0; left: -100px; width: 92px; z-index: 30; transition: left .22s ease; box-shadow: 4px 0 16px rgba(0, 0, 0, .3); }
  .pdf-thumb-rail.show { left: 0; }
  .viewer-wrap.dark { max-height: 42vh; }

  .viewer-wrap iframe { height: calc(100dvh - 132px); }
  .hero { padding: 20px; border-radius: 14px; }
  .hero h1 { font-size: 18px; }
  .teacher-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .teacher-card { padding: 14px; }
  .course-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  /* Thanh điều hướng dưới cùng kiểu app di động */
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: calc(58px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid #E2E8F0; z-index: 40; box-shadow: 0 -6px 18px rgba(15, 20, 35, .07); }
  .bn-item { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #94A3B8; font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .bn-item svg { width: 21px; height: 21px; }
  .bn-item.active { color: #3B8FC4; }
  .bn-item:disabled { opacity: .35; cursor: not-allowed; }
}
@media (max-width: 420px) {
  .sb-head h2 { font-size: 15px; }
}

/* ===== Bài kiểm tra / thi online (test, reading-test, listening-test) ===== */
.exam-landing { padding: 8px 4px 32px; max-width: 820px; margin: 0 auto; }
.exam-info-card { background: #F8FAFC; border: 1px solid #E8ECF1; border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px 16px; align-items: center; margin-bottom: 0; box-sizing: border-box; max-width: 100%; }

}
.exam-result-box { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 28px 24px; color: #94A3B8; font-size: 13.5px; text-align: center; box-shadow: 0 1px 3px rgba(15,23,42,.04); }

.exam-result-score { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.exam-result-score b { font-size: 26px; color: #3B8FC4; }
.exam-result-score span { font-size: 13px; color: #64748B; }


/* Section cards (giống layout tham chiếu) */
.lesson-section { background: #fff; border: 1px solid #E8ECF1; border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.04); }
.lesson-section-title { font-size: 14px; font-weight: 600; color: #0F172A; margin-bottom: 14px; letter-spacing: -0.01em; }
.lesson-section .desc-html { background: transparent !important; padding: 0 !important; margin: 0 !important; border-radius: 0 !important; }
.lesson-section .attach-inline { margin-bottom: 0 !important; }
/* exam-start-cta margin handled in .exam-info-card */

.exam-runner {
  display: flex; flex-direction: column; height: 100%;
  font-family: Arial, Helvetica, 'Segoe UI', Roboto, sans-serif;
  background: #fff; color: #0F172A; transition: background .25s ease, color .25s ease;
}
.exam-toolbar { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid #E8ECF1; background: #fff; flex-shrink: 0; flex-wrap: wrap; transition: background .25s ease, border-color .25s ease; }
.exam-timer { font-weight: 700; color: #3B8FC4; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.exam-timer svg { width: 16px; height: 16px; }
.exam-answered { font-size: 13.5px; color: #64748B; margin-left: auto; }
.exam-tool-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #64748B; cursor: pointer; transition: all .15s; flex-shrink: 0; }
.exam-tool-btn:hover { border-color: #3B8FC4; color: #3B8FC4; }
.exam-tool-btn.active { background: #3B8FC4; border-color: #3B8FC4; color: #fff; }
.exam-tool-btn svg { width: 16px; height: 16px; }
.exam-fontsize-group { display: flex; align-items: center; gap: 2px; border: 1px solid #d1d5db; border-radius: 8px; padding: 2px; }
.exam-fontsize-group button { width: 28px; height: 28px; border: none; background: none; border-radius: 6px; cursor: pointer; color: #64748B; font-weight: 700; font-size: 14px; }
.exam-fontsize-group button:hover { background: #F1F5F9; color: #3B8FC4; }
.exam-submit-btn { background: #3B8FC4; color: #fff; border: none; padding: 9px 20px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; transition: background .15s, box-shadow .15s; white-space: nowrap; box-shadow: 0 1px 3px rgba(59,143,196,.25); }
.exam-submit-btn:hover { background: #2F7AAB; box-shadow: 0 4px 12px rgba(59,143,196,.3); }
.exam-submit-btn:disabled { background: #b7c2d6; cursor: default; }

.exam-body { flex: 1; display: flex; overflow: hidden; }
.exam-body.split .exam-passage { flex: 1; overflow-y: auto; padding: 24px 28px; border-right: 1px solid #F1F5F9; background: #fff; line-height: 1.85; }
.exam-questions { flex: 1; overflow-y: auto; padding: 24px 28px; background: #fff; }
.exam-audio-bar { padding: 14px 20px; border-bottom: 1px solid #E8ECF1; background: #F8FAFC; }
.exam-audio-bar audio { width: 100%; }

/* Cỡ chữ trong bài thi điều khiển được qua biến này (mặc định 16px, Sans Serif) */
.exam-passage, .exam-questions { font-size: var(--exam-font-size, 16px); }

.exam-q { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid #F1F5F9; scroll-margin-top: 16px; }
.exam-q:last-child { border-bottom: none; }
.exam-q-title { line-height: 1.6; margin-bottom: 12px; color: inherit; }
.exam-q-title b { color: #3B8FC4; }
.exam-q-num { font-weight: 700; color: #3B8FC4; margin-right: 2px; }
.exam-opts { display: flex; flex-direction: column; gap: 8px; margin-left: 2px; }
.exam-choice-row { display: flex; align-items: center; gap: 12px; padding: 6px 4px; border-radius: 8px; }

.exam-match-explain-row { margin-top: 10px; font-weight: 400; }
.exam-match-explain-row:first-of-type { margin-top: 10px; }
.exam-match-explain-row b { color: #0F172A; font-weight: 700; margin-right: 4px; }
.exam-inline-explain-list { margin-top: 16px; padding-top: 12px; border-top: 1px dashed #E2E8F0; color: #64748B; line-height: 1.7; font-weight: 400; }
.exam-inline-explain-row { margin-top: 10px; font-weight: 400; }
.exam-inline-explain-row b { color: #0F172A; font-weight: 700; margin-right: 4px; }

/* Đúng/sai nhiều ý */
.exam-tf-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.exam-tf-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 4px; border-bottom: 1px solid #F1F5F9; }
.exam-tf-text { flex: 1; }
.exam-tf-btns { display: flex; gap: 8px; flex-shrink: 0; }
.exam-tf-btn { width: 56px; padding: 6px 0; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; color: #64748B; font-weight: 700; font-size: 13px; cursor: pointer; transition: all .12s; }
.exam-tf-btn:hover { border-color: #3B8FC4; color: #3B8FC4; }
.exam-tf-btn.picked { background: #3B8FC4; border-color: #3B8FC4; color: #fff; }
.exam-tf-btn.res-correct-fill { background: #1a7a40; border-color: #1a7a40; color: #fff; }
.exam-tf-btn.res-wrong-fill { background: #c0392b; border-color: #c0392b; color: #fff; }
.exam-tf-btn.res-correct-outline { background: #fff; border-color: #1a7a40; color: #1a7a40; }

/* Điền khuyết (rời & điền ngay trong câu) + chọn từ danh sách + kéo thả (hiện dưới dạng chọn) */
.exam-blank-input { font-family: inherit; font-size: .86em; line-height:1.25; padding: 6px 9px; border: 1px solid #d1d5db; border-radius: 8px; width: 11ch; min-width: 90px; max-width: 18ch; height: 34px; box-sizing:border-box; color: inherit; background: #fff; vertical-align: middle; }
.exam-blank-input:focus { outline: none; border-color: #3B8FC4; }
.exam-blank-input.res-input-correct { border-color: #1a7a40; background: #eefbf2; }
.exam-blank-input.res-input-wrong { border-color: #c0392b; background: #fdecec; }
.exam-blank-input-lg { display:block !important; width:100% !important; max-width:640px !important; min-width:220px !important; height:auto !important; min-height:64px !important; font-size:.95em !important; line-height:1.5 !important; padding:10px 12px !important; resize:vertical; font-family:inherit; }
.exam-correct-hint { display: inline-block; margin-left: 8px; color: #1a7a40; font-size: 0.85em; font-weight: 600; }
.exam-correct-hint s { color: #c0392b; text-decoration-color: #c0392b; margin-right: 4px; }
.exam-blank-wrap { display: inline-flex; align-items: center; gap: 3px; margin: 0 2px; }
.exam-blank-num { color: #3B8FC4; font-weight: 700; font-size: 1em; margin-right: 1px; }
.exam-inline-select { font-family: inherit; font-size: .86em; line-height:1.25; padding: 5px 8px; min-width: 96px; max-width: 18ch; height:34px; border: 1px solid #d1d5db; border-radius: 8px; color: inherit; background: #fff; cursor: pointer; vertical-align:middle; }
.exam-inline-group { line-height: 2.2; }
.exam-dragbank { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; padding: 10px 12px; border: 1px dashed #d1d5db; border-radius: 10px; background: #f9fafb; }
.exam-dragbank-item { padding: 7px 15px; border-radius: 999px; border: 1px solid #C5DFF0; background: #F2F8FC; color: #3B8FC4; font-weight: 600; font-size: 0.9em; font-family: inherit; cursor: pointer; transition: all .12s; }
.exam-dragbank-item:hover:not(:disabled) { border-color: #3B8FC4; background: #e2f1fc; }
.exam-dragbank-item.armed { background: #3B8FC4; border-color: #3B8FC4; color: #fff; box-shadow: 0 0 0 3px rgba(59,143,196,.15); }
.exam-dragbank-item.used, .exam-dragbank-item:disabled { opacity: .35; cursor: default; text-decoration: line-through; }
.exam-dragdrop-slot {
  display: inline-flex; align-items: center; gap: 6px; min-width: 88px; height: 32px;
  padding: 0 10px; border: 1.5px dashed #9aa8c4; border-radius: 8px; background: #F8FAFC;
  cursor: pointer; vertical-align: middle; font-weight: 600; font-size: .95em; color: #64748B;
}
.exam-dragdrop-slot:hover { border-color: #3B8FC4; color: #3B8FC4; }

.exam-dragdrop-slot.filled.res-correct { border-color: #1a7a40; background: #eefbf2; color: #1a7a40; }
.exam-dragdrop-slot.filled.res-wrong { border-color: #e0e6f0; background: #fdecec; color: #64748B; }
.exam-dragdrop-slot-text { white-space: nowrap; }
.exam-dragdrop-slot-text.is-wrong { color: #c0392b; text-decoration: line-through; }
.exam-dragdrop-remove {
  width: 16px; height: 16px; border-radius: 50%; border: none; background: rgba(59,143,196,.15);
  color: #3B8FC4; font-size: 11px; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 0;
}
.exam-dragdrop-remove:hover { background: #e0453f; color: #fff; }
.exam-dragdrop-correct-hint { color: #1a7a40; font-weight: 700; font-size: .85em; white-space: nowrap; }

/* ----- Bảng trả lời nhanh (kiểu phiếu trả lời trắc nghiệm) ----- */
.exam-nav { width: 300px; flex-shrink: 0; border-left: 1px solid #F1F5F9; background: #F8FAFC; display: flex; flex-direction: column; padding: 16px; min-height: 0; }

.exam-sheet-page { display: none; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
.exam-sheet-page.show { display: flex; }
.exam-sheet-row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-radius: 8px; flex-wrap: wrap; }

  --bg: #F3F6FB;
  --bg-mesh: radial-gradient(1200px 600px at 12% -10%, rgba(59,143,196,.12), transparent 55%),
             radial-gradient(900px 500px at 95% 0%, rgba(126,184,217,.14), transparent 50%),
             radial-gradient(700px 400px at 50% 100%, rgba(168,212,236,.08), transparent 60%),
             #F3F6FB;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.03);
  --shadow-md: 0 8px 24px -8px rgba(15,23,42,.12), 0 2px 8px rgba(59,143,196,.06);
  --shadow-lg: 0 18px 40px -12px rgba(15,23,42,.16), 0 6px 16px rgba(59,143,196,.08);
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.4,0,.2,1);
}

body { background: var(--bg-mesh); color: var(--ink); }

/* Global smooth scroll + refined selection */
.content { scroll-behavior: smooth; }
::selection { background: rgba(59,143,196,.22); color: var(--ink); }

/* Subtle page entrance */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(.96); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes floatSoft {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* Top progress — richer glow */
.top-progress {
  height: 3.5px;
  background: linear-gradient(90deg, #256B96, #3B8FC4, #A8D4EC, #3B8FC4);
  background-size: 200% 100%;
  box-shadow: 0 0 14px rgba(59,143,196,.55), 0 0 4px rgba(168,212,236,.4);
}

/* Sidebar polish */
.sidebar {
  background: linear-gradient(180deg, #fff 0%, #FBFCFD 100%);
  box-shadow: 4px 0 24px rgba(15,23,42,.04);
}
.sb-head {
  background: linear-gradient(135deg, #2F7AAB 0%, #3B8FC4 48%, #5BA3D0 100%);
  position: relative;
  overflow: hidden;
}
.sb-head::after {
  content: '';
  position: absolute; right: -20px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(255,255,255,.1);
  pointer-events: none;
}
.sb-head::before {
  content: '';
  position: absolute; left: 40%; bottom: -40px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,.06);
  pointer-events: none;
}
.folder-hd {
  transition: background .18s var(--ease), transform .15s var(--ease), box-shadow .18s;
}
.folder-hd:hover { box-shadow: inset 0 0 0 1px #E2E8F0; }
.lvl1-hd {
  background: linear-gradient(90deg, #EEF2F7, #F5F7FA) !important;
  border-left: 3px solid transparent;
}
.lvl1-hd.open, .lvl1-hd:hover {
  border-left-color: var(--brand);
}
.leaf {
  transition: background .14s var(--ease), color .14s, transform .12s, box-shadow .14s;
  position: relative;
}
.leaf:hover {
  transform: translateX(2px);
  box-shadow: inset 3px 0 0 var(--brand-mid);
}
.leaf.active {
  background: linear-gradient(90deg, #E0F0FA, #F0F8FD) !important;
  box-shadow: inset 3px 0 0 var(--brand);
}
.leaf.completed .leaf-title { position: relative; }
.leaf-badge {
  transition: transform .2s var(--ease), color .15s;
}
.leaf:hover .leaf-badge { transform: scale(1.08); }

/* Topbar */
.topbar {
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 var(--line), 0 4px 16px rgba(15,23,42,.03);
}
.icon-btn {
  transition: background .15s, transform .15s, color .15s;
}
.icon-btn:hover { transform: scale(1.05); }
.topbar-home-btn {
  transition: background .15s, transform .15s, color .15s;
}
.topbar-home-btn:hover { transform: scale(1.04); }

/* Hero — richer, with decorative orbs */
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #256B96 0%, #3B8FC4 42%, #6BB5D9 100%) !important;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.18) !important;
  animation: fadeUp .45s var(--ease) both;
}
.hero::before {
  content: '';
  position: absolute; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
  top: -80px; right: -40px; pointer-events: none;
}
.hero::after {
  content: '';
  position: absolute; width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
  bottom: -50px; left: 15%; pointer-events: none;
}
.hero h1 {
  font-size: 22px !important;
  letter-spacing: -0.02em;
  text-shadow: 0 1px 2px rgba(0,0,0,.08);
  position: relative; z-index: 1;
}
.hero p { position: relative; z-index: 1; opacity: .94 !important; }
.hero .hero-stats {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; position: relative; z-index: 1;
}
.hero .hero-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.22);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600;
}
.hero .hero-chip svg { width: 14px; height: 14px; opacity: .95; }

/* Section titles */
.section-title {
  margin-top: 10px !important;
  animation: fadeUp .4s var(--ease) .05s both;
}
.section-title svg {
  padding: 6px; border-radius: 10px;
  background: var(--brand-soft); color: var(--brand) !important;
  width: 28px !important; height: 28px !important;
  box-sizing: border-box;
}

/* Teacher cards */
.teacher-grid { animation: fadeUp .45s var(--ease) .08s both; }
.teacher-card {
  position: relative;
  background: var(--surface) !important;
  border: 1px solid var(--line) !important;
  border-radius: var(--radius-lg) !important;
  box-shadow: var(--shadow-sm) !important;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease), border-color .2s !important;
  overflow: hidden;
}
.teacher-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--brand), var(--brand-mid));
  opacity: 0; transition: opacity .2s;
}
.teacher-card:hover {
  transform: translateY(-4px) !important;
  box-shadow: var(--shadow-lg) !important;
  border-color: #C5DFF0 !important;
}
.teacher-card:hover::before { opacity: 1; }
.teacher-card .avatar {
  width: 80px !important; height: 80px !important;
  border: 3px solid #F0F7FC !important;
  box-shadow: 0 6px 16px rgba(59,143,196,.15);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.teacher-card:hover .avatar {
  transform: scale(1.04);
  box-shadow: 0 10px 24px rgba(59,143,196,.22);
}
.teacher-card .avatar.placeholder {
  background: linear-gradient(135deg, #E8F4FC, #D4ECF8) !important;
  color: var(--brand-deep) !important;
}
.teacher-card .subject-tag {
  background: linear-gradient(135deg, #E8F4FC, #F2F8FC) !important;
  border: 1px solid #D4EAF7;
  letter-spacing: .02em;
}
.teacher-card .cta {
  margin-top: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--brand-soft);
  transition: background .15s, color .15s, transform .15s;
}
.teacher-card:hover .cta {
  background: var(--brand);
  color: #fff !important;
}
.teacher-card:hover .cta svg { color: #fff; transform: translateX(3px); }

/* Course cards */
.course-grid { animation: fadeUp .4s var(--ease) .06s both; }
.course-card {
  border-radius: var(--radius-lg) !important;
  box-shadow: var(--shadow-sm) !important;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease) !important;
  border: 1px solid var(--line) !important;
  overflow: hidden;
}
.course-card:hover {
  transform: translateY(-4px) !important;
  box-shadow: var(--shadow-lg) !important;
}
.course-card .thumb, .course-card .thumb-fallback {
  transition: transform .35s var(--ease);
}
.course-card:hover .thumb, .course-card:hover .thumb-fallback {
  transform: scale(1.04);
}
.course-card .thumb-fallback {
  background: linear-gradient(135deg, #256B96, #5BA3D0, #A8D4EC) !important;
}
.course-card .info { gap: 7px !important; }
.course-card h4 {
  transition: color .15s;
}
.course-card:hover h4 { color: var(--brand-deep); }
.chip {
  letter-spacing: .02em;
  box-shadow: 0 1px 2px rgba(15,23,42,.04);
}
.chip.free { background: linear-gradient(135deg, #e8f8ee, #d4f0de) !important; }
.chip.price { background: linear-gradient(135deg, #fff4e0, #ffe8c2) !important; }
.chip.featured { background: linear-gradient(135deg, #fdeef0, #fad4da) !important; }

/* Catalog tools */
.cat-pill {
  transition: all .18s var(--ease) !important;
  border-radius: 999px !important;
}
.cat-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59,143,196,.12);
}
.cat-pill.active {
  box-shadow: 0 4px 14px rgba(59,143,196,.28) !important;
}
.catalog-search input {
  border-radius: 999px !important;
  transition: border-color .15s, box-shadow .15s;
}
.catalog-search input:focus {
  box-shadow: 0 0 0 3px rgba(59,143,196,.12), 0 4px 12px rgba(59,143,196,.08);
}

/* Content area cards / sections */
.lesson-section {
  border-radius: var(--radius-md) !important;
  box-shadow: var(--shadow-sm) !important;
  transition: box-shadow .2s;
  animation: fadeUp .35s var(--ease) both;
}
.lesson-section:hover { box-shadow: var(--shadow-md); }
.viewer-wrap {
  box-shadow: 0 8px 28px rgba(15,23,42,.12) !important;
  border-radius: 12px !important;
}

/* Buttons unified polish */
.btn-support, .auth-toggle, .saved-header-btn, .exam-submit-btn, .modal-close-btn {
  transition: background .18s, box-shadow .18s, transform .15s !important;
}
.btn-support:hover, .auth-toggle:hover, .saved-header-btn:hover,
.exam-submit-btn:hover, .modal-close-btn:hover {
  transform: translateY(-1px);
}

/* Progress bar in course */
.course-progress-bar {
  height: 8px !important;
  background: #E2E8F0 !important;
  box-shadow: inset 0 1px 2px rgba(15,23,42,.06);
}
.course-progress-bar > span {
  background: linear-gradient(90deg, #256B96, #3B8FC4, #7EB8D9) !important;
  box-shadow: 0 0 8px rgba(59,143,196,.35);
}

/* Complete lesson button */
.complete-lesson-btn {
  transition: all .2s var(--ease) !important;
}
.complete-lesson-btn:hover {
  transform: scale(1.08);
}
.complete-lesson-btn.done {
  box-shadow: 0 0 0 3px rgba(26,122,64,.18);
}

/* Empty / loading states */
.state, .sb-body .state {
  animation: fadeUp .4s var(--ease) both;
}
.state svg, .sb-body .state svg {
  opacity: .7;
  animation: floatSoft 3s ease-in-out infinite;
}

/* Exam UI polish */
.exam-info-card {
  background: linear-gradient(135deg, #F8FAFC, #F0F7FC) !important;
  border-color: #D4EAF7 !important;
  box-shadow: var(--shadow-sm);
}
.exam-result-box.has-result {
  background: linear-gradient(135deg, #E8F4FC, #F2F8FC) !important;
  box-shadow: var(--shadow-sm);
}
.exam-toolbar {
  background: rgba(255,255,255,.96) !important;
  backdrop-filter: blur(8px);
}
.exam-letter {
  transition: transform .12s, background .12s, border-color .12s, color .12s !important;
}
.exam-letter:hover:not(:disabled) {
  transform: scale(1.08);
}
.exam-part-tab {
  transition: all .15s var(--ease) !important;
}
.exam-part-tab:hover { transform: translateY(-1px); }
.exam-celebrate .big-score {
  background: linear-gradient(135deg, #256B96, #3B8FC4);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Notice boxes */
.notice-box.blue {
  background: linear-gradient(135deg, #F0F8FD, #E8F4FC) !important;
  box-shadow: var(--shadow-sm);
}

/* Modal */
.modal-box {
  border-radius: 16px !important;
  box-shadow: 0 24px 60px rgba(15,23,42,.2) !important;
}

/* Auth panel */
#auth-panel .auth-panel-box {
  border-radius: 16px !important;
  box-shadow: 0 20px 50px rgba(15,23,42,.18) !important;
}
.auth-panel-top {
  background: linear-gradient(135deg, #2F7AAB, #3B8FC4) !important;
}

/* Bottom nav mobile */
.bottom-nav {
  background: rgba(255,255,255,.96) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.bn-item {
  transition: color .15s, transform .15s;
}
.bn-item:active { transform: scale(.94); }
.bn-item.active {
  position: relative;
}
.bn-item.active::after {
  content: '';
  position: absolute; top: 4px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--brand);
}

/* Scrollbar global content */
.content::-webkit-scrollbar,
.sb-body::-webkit-scrollbar {
  width: 6px;
}
.content::-webkit-scrollbar-thumb,
.sb-body::-webkit-scrollbar-thumb {
  background: rgba(148,163,184,.4);
  border-radius: 999px;
}
.content::-webkit-scrollbar-thumb:hover,
.sb-body::-webkit-scrollbar-thumb:hover {
  background: rgba(100,116,139,.55);
}

/* Saved page */
.saved-main-group {
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.saved-main-group:hover { box-shadow: var(--shadow-md); }
.saved-main-item {
  transition: background .15s, transform .12s;
}
.saved-main-item:hover { transform: translateX(2px); }

/* Attach rows */
.attach-row {
  transition: background .15s, border-color .15s, transform .12s, box-shadow .15s !important;
}
.attach-row:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59,143,196,.08);
}

/* PDF control bar */
.pdf-control-bar {
  background: linear-gradient(90deg, #2F7AAB, #3B8FC4) !important;
  box-shadow: 0 2px 8px rgba(47,122,171,.25);
}

/* Video loading */
.video-loading-overlay {
  backdrop-filter: blur(4px);
}

/* Catalog head spacing */
.catalog-head { margin-bottom: 4px; }

/* Soft pulse for active complete button */
@keyframes donePulse {
  0% { box-shadow: 0 0 0 0 rgba(26,122,64,.35); }
  70% { box-shadow: 0 0 0 8px rgba(26,122,64,0); }
  100% { box-shadow: 0 0 0 0 rgba(26,122,64,0); }
}
.complete-lesson-btn.done { animation: donePulse .6s ease-out; }

/* Mobile refinements */
@media (max-width: 860px) {
  .hero { padding: 22px 18px !important; }
  .hero h1 { font-size: 18.5px !important; }
  .teacher-card .avatar { width: 68px !important; height: 68px !important; }
  .course-card:hover, .teacher-card:hover { transform: translateY(-2px) !important; }
  .leaf:hover { transform: none; }
}

/* Reduce motion preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}


/* ================================================================
   V10 — chỉnh từ V7, gọn, đúng yêu cầu
   ================================================================ */

/* Plyr: thanh tối, tooltip seek đen, menu settings đen, volume ngắn */
.viewer-wrap .plyr {
  --plyr-color-main: #3B8FC4;
  --plyr-range-fill-background: #3B8FC4;
  --plyr-video-control-color: #fff;
  --plyr-video-control-color-hover: #fff;
  --plyr-video-control-bg-hover: rgba(255,255,255,.14);
  --plyr-tooltip-background: rgba(15,20,30,.92);
  --plyr-tooltip-color: #fff;
  --plyr-tooltip-radius: 6px;
  --plyr-menu-background: rgba(22,26,34,.96);
  --plyr-menu-color: #fff;
  --plyr-range-track-height: 4px;
}
.viewer-wrap .plyr--video .plyr__controls {
  background: linear-gradient(180deg, transparent 0%, rgba(28,32,40,.5) 30%, rgba(18,22,30,.94) 100%) !important;
  padding: 16px 12px 10px !important;
}
.viewer-wrap .plyr__tooltip {
  background: rgba(15,20,30,.92) !important;
  color: #fff !important;
  font-weight: 600 !important;
}
.viewer-wrap .plyr__menu__container {
  background: rgba(22,26,34,.96) !important;
  color: #fff !important;
  border-radius: 8px !important;
}
.viewer-wrap .plyr__menu__container .plyr__control {
  color: #fff !important;
}
.viewer-wrap .plyr__menu__container .plyr__control--forward::after {
  border-left-color: rgba(255,255,255,.5);
}
.viewer-wrap .plyr__menu__container .plyr__control--back::before {
  border-right-color: rgba(255,255,255,.5);
}
.viewer-wrap .plyr__volume input[type=range] {
  max-width: 56px !important;
  width: 56px !important;
}
.viewer-wrap .plyr__time {
  cursor: pointer;
  font-weight: 600;
  color: #fff;
}

/* Cây bài: chỉ tắt hover + viền xanh; chevron to đậm */
.sidebar .folder-hd:hover { background: inherit !important; box-shadow: none !important; }
.sidebar .lvl1-hd { border-left: none !important; }
.sidebar .lvl1-hd:hover,
.sidebar .lvl1-hd.open { border-left: none !important; background: #F0F2F5 !important; }
.sidebar .lvl2-hd:hover, .sidebar .lvl3-hd:hover,
.sidebar .lvl4-hd:hover, .sidebar .lvl5-hd:hover { background: #fff !important; }
.sidebar .leaf:hover {
  background: transparent !important;
  transform: none !important;
  box-shadow: none !important;
  color: inherit !important;
}
.sidebar .leaf.active { background: #E8F4FC !important; box-shadow: none !important; }
.sidebar .leaf:hover .leaf-badge { transform: none !important; }
.sidebar .folder-hd .ch {
  width: 22px !important; height: 22px !important;
  color: #1E293B !important;
}
.sidebar .folder-hd .ch svg { width: 20px !important; height: 20px !important; stroke-width: 2.9 !important; }

/* Không scale thumbnail */
.course-card:hover .thumb,
.course-card:hover .thumb-fallback { transform: none !important; }

/* PDF 100% không cuộn ngang; zoom lớn mới cuộn */
.pdf-canvas-container { padding: 12px !important; justify-content: center !important; }
.pdf-scroll-page { max-width: 100%; }
.pdf-scroll-page canvas { display: block; max-width: 100%; height: auto; }
.pdf-scroll-page.is-zoomed { max-width: none; }
.pdf-scroll-page.is-zoomed canvas { max-width: none !important; }
.pdf-btn.active { background: rgba(255,255,255,.28); }

/* Thumb rail: ẩn mặc định, bấm mới mở (mọi màn hình) */
.pdf-thumb-rail {
  width: 0 !important;
  min-width: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
  opacity: 0;
  transition: width .2s ease, opacity .15s ease, padding .2s ease;
}
.pdf-thumb-rail.show {
  width: 92px !important;
  min-width: 92px !important;
  padding: 12px 8px !important;
  overflow-y: auto !important;
  opacity: 1;
}
@media (max-width: 860px) {
  .pdf-thumb-rail {
    position: fixed !important;
    top: 0; bottom: 0;
    left: -110px !important;
    width: 92px !important;
    min-width: 92px !important;
    padding: 12px 8px !important;
    opacity: 1 !important;
    z-index: 35;
    transition: left .22s ease !important;
  }
  .pdf-thumb-rail.show { left: 0 !important; }
}

/* Nhóm câu — dải cờ */
.exam-group-range {
  display: inline-flex !important;
  align-items: center !important;
  position: relative !important;
  height: 30px !important;
  padding: 0 14px 0 12px !important;
  margin: 0 14px 12px 0 !important;
  font-size: 14px !important;
  font-weight: 800 !important;
  font-family: Inter, Roboto, system-ui, sans-serif !important;
  color: #fff !important;
  background: #3B8FC4 !important;
  border: none !important;
  border-radius: 4px 0 0 4px !important;
  line-height: 30px !important;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(59,143,196,.22);
}
.exam-group-range::after {
  content: '';
  position: absolute;
  right: -12px; top: 0;
  border-style: solid;
  border-width: 15px 0 15px 12px;
  border-color: transparent transparent transparent #3B8FC4;
}

/* Nút ABCD — đậm, gọn, đồng bộ đề + phiếu */
.exam-letter {
  width: 28px !important;
  height: 28px !important;
  font-size: 13px !important;
  font-weight: 800 !important;
  font-family: Inter, Roboto, Arial, sans-serif !important;
  border-radius: 50% !important;
  border: 1.5px solid #C8D0DC !important;
  background: #EEF1F6 !important;
  color: #1E293B !important;
  box-shadow: none !important;
}
.exam-letter:hover:not(:disabled) {
  border-color: #3B8FC4 !important;
  background: #E0F0FA !important;
  color: #256B96 !important;
  transform: none !important;
}
.exam-letter.picked {
  background: #3B8FC4 !important;
  border-color: #3B8FC4 !important;
  color: #fff !important;
}
.exam-sheet-opts .exam-letter,
.exam-choice-row .exam-letter {
  width: 28px !important;
  height: 28px !important;
  font-size: 13px !important;
  font-weight: 800 !important;
}
.exam-sheet-row .qnum {
  font-weight: 800 !important;
  font-size: 13px !important;
  color: #1E293B !important;
}
@media (max-width: 860px) {

function hexToRgb(hex) {
  const h = String(hex || '').replace('#', '').trim();
  if (h.length === 3) {
    return { r: parseInt(h[0]+h[0],16), g: parseInt(h[1]+h[1],16), b: parseInt(h[2]+h[2],16) };
  }
  if (h.length >= 6) {
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  return { r: 59, g: 143, b: 196 };
}
function rgbToHex(r, g, b) {
  const c = n => Math.max(0, Math.min(255, n|0)).toString(16).padStart(2,'0');
  return '#' + c(r) + c(g) + c(b);
}
function mixHex(hex, withWhite, t) {
  const { r, g, b } = hexToRgb(hex);
  const tr = withWhite ? 255 : 0, tg = withWhite ? 255 : 0, tb = withWhite ? 255 : 0;
  return rgbToHex(Math.round(r+(tr-r)*t), Math.round(g+(tg-g)*t), Math.round(b+(tb-b)*t));
}
function applyAppTheme(hex) {
  let color = hex && /^#?[0-9a-fA-F]{3,8}$/.test(String(hex).trim())
    ? (String(hex).startsWith('#') ? String(hex) : '#' + hex)
    : '#3B8FC4';
  if (color.length === 4) {
    const h = color.slice(1);
    color = '#' + h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  }
  const { r, g, b } = hexToRgb(color);
  const deep = mixHex(color, false, 0.12);
  const mid = mixHex(color, true, 0.42);
  const soft = mixHex(color, true, 0.90);
  const softer = mixHex(color, true, 0.95);
  const root = document.documentElement;
  root.style.setProperty('--brand', color);
  root.style.setProperty('--brand-deep', deep);
  root.style.setProperty('--brand-mid', mid);
  root.style.setProperty('--brand-soft', soft);
  root.style.setProperty('--brand-softer', softer);
  root.style.setProperty('--brand-rgb', r + ', ' + g + ', ' + b);
  try { localStorage.setItem(THEME_STORAGE_KEY, color); } catch (e) {}
  const customInput = document.getElementById('theme-custom-input');
  if (customInput && color.length === 7) customInput.value = color;
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.classList.toggle('active', (el.dataset.hex||'').toLowerCase() === color.toLowerCase());
  });
  const runner = document.getElementById('exam-runner');
  if (runner) {
    runner.style.setProperty('--exam-accent', color);
    runner.style.setProperty('--exam-accent-soft', soft);
    runner.style.setProperty('--exam-accent-mid', mid);
    // Đồng bộ luôn với brand toàn trang
    runner.style.setProperty('--brand', color);
  }
}

function initThemeUI() {
  const toggle = document.getElementById('theme-toggle');
  const panel = document.getElementById('theme-panel');
  const swatches = document.getElementById('theme-swatches');
  const closeBtn = document.getElementById('theme-panel-close');
  if (!toggle || !panel || !swatches) return;

  const openPanel = () => { panel.classList.add('show'); toggle.classList.add('active'); };
  const closePanel = () => { panel.classList.remove('show'); toggle.classList.remove('active'); };

  swatches.innerHTML = THEME_PRESETS.map(p =>
    `<button type="button" class="theme-swatch" data-hex="${p.hex}" title="${p.name}" style="background:${p.hex}" aria-label="${p.name}"><span class="theme-swatch-name">${p.name}</span></button>`
  ).join('');

  let saved = '#3B8FC4';
  try { saved = localStorage.getItem(THEME_STORAGE_KEY) || '#3B8FC4'; } catch (e) {}
  applyAppTheme(saved);

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    if (panel.classList.contains('show')) closePanel();
    else openPanel();
  });
  closeBtn?.addEventListener('click', closePanel);
  panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });

  swatches.addEventListener('click', e => {
    const btn = e.target.closest('.theme-swatch');
    if (!btn) return;
    applyAppTheme(btn.dataset.hex);
    // chọn preset: đổi màu, giữ popup để xem — chỉ Áp dụng mới đóng
  });
  document.getElementById('theme-apply-custom')?.addEventListener('click', () => {
    const v = document.getElementById('theme-custom-input')?.value;
    if (v) applyAppTheme(v);
    closePanel();
  });
  document.getElementById('theme-custom-input')?.addEventListener('input', e => applyAppTheme(e.target.value));
}

function getCompletedMap() {
  try {
    const raw = localStorage.getItem(COMPLETED_LESSONS_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) { return {}; }
}
function setCompletedMap(map) {
  try { localStorage.setItem(COMPLETED_LESSONS_KEY, JSON.stringify(map || {})); } catch (e) {}
}
function isLessonCompleted(courseId, lessonId) {
  if (!courseId || !lessonId) return false;
  const m = getCompletedMap();
  const set = m[String(courseId)];
  return !!(set && set[String(lessonId)]);
}
function toggleLessonCompleted(courseId, lessonId) {
  if (!courseId || !lessonId) return false;
  const m = getCompletedMap();
  const cid = String(courseId);
  const lid = String(lessonId);
  if (!m[cid] || typeof m[cid] !== 'object') m[cid] = {};
  if (m[cid][lid]) delete m[cid][lid];
  else m[cid][lid] = Date.now();
  setCompletedMap(m);
  return !!m[cid][lid];
}
function countCompletedInCourse(courseId) {
  const m = getCompletedMap()[String(courseId)] || {};
  return Object.keys(m).length;
}
function courseProgressHtml(courseId, totalLessons) {
  const done = countCompletedInCourse(courseId);
  const total = Math.max(0, totalLessons | 0);
  const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
  return `<div class="course-progress-wrap" data-course-progress="${esc(String(courseId))}">
    <div class="course-progress-meta"><span>Hoàn thành</span><span>${done}/${total || '?'} · ${pct}%</span></div>
    <div class="course-progress-bar"><span style="width:${pct}%"></span></div>
  </div>`;
}
function updateCourseProgressUI(courseId) {
  if (!courseId) return;

  });

  const sb = document.getElementById('sb-course-progress');

}

    : `<div class="avatar placeholder">${initials}</div>`;

    <div class="teacher-card" onclick="selectTeacherByKey('${t.key}')">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>

const TEACHER_BIO_CACHE = {};

function selectTeacher(t) {
  document.querySelector('.app').classList.add('catalog-mode');
  document.querySelector('.app')?.classList.remove('in-lesson');
  TEACHER = t; COURSE = null;
  document.getElementById('sb-home-btn')?.classList.remove('active');
  
  CUR_CATEGORY = 'all';
  document.getElementById('sb-title').textContent = t.name;
  const tagEl = document.getElementById('sb-tag');
  tagEl.className = '';
  tagEl.onclick = null;
  tagEl.textContent = t.subject || '';
  setBreadcrumb([t.name]);
  setSupportAvailable(false);
  ALL_LEAVES = [];
  document.getElementById('sb-body').innerHTML = '<div class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><p>Chọn một khoá học để xem danh sách bài học</p></div>';
  setActiveBottomNav('bn-home');
  autoCloseSBOnMobile();

  if (COURSE_CACHE[t.key]) {
    COURSES = COURSE_CACHE[t.key];
    renderCatalog();
    if (PENDING_LESSON_OPEN) {
      const pending=PENDING_LESSON_OPEN; PENDING_LESSON_OPEN=null;
      const c=COURSES.find(x=>String(x.id)===String(pending.courseId));
      if(c) selectCourse(c);
    }
    return;
  }

  showContent('<div class="state"><div class="spinner"></div><p>Đang tải danh sách khoá học của ' + esc(t.name) + '...</p></div>');
  startProgress();

  apiFetch(t.coursesApi).then(raw => {
    doneProgress();
    const list = Array.isArray(raw) ? raw : (raw.data || raw.results || []);
    extractTeacherBio(t, list);
    COURSES = normalizeCourses(t, list);
    COURSE_CACHE[t.key] = COURSES;
    renderCatalog();
    if (PENDING_LESSON_OPEN) {
      const pending=PENDING_LESSON_OPEN; PENDING_LESSON_OPEN=null;
      const c=COURSES.find(x=>String(x.id)===String(pending.courseId));
      if(c) selectCourse(c);
    }
  }).catch(e => {
    doneProgress();
    showContent(`<div class="err">Không tải được danh sách khoá học của ${esc(t.name)}: ${esc(e.message)}
      <br><button class="btn-refresh" style="margin-top:10px" onclick="selectTeacher(TEACHER)">Thử lại</button></div>`);
  });
}

// Lấy avatar + mô tả ngắn của giáo viên từ chính dữ liệu khoá học (trường "authors")
function extractTeacherBio(t, rawList) {
  if (TEACHER_BIO_CACHE[t.key] || !rawList || !rawList.length) return;
  const authors = rawList[0].authors || [];
  if (!authors.length) return;
  const author = authors[authors.length - 1];
  let avatar = '';
  if (author.avatar && author.avatar.origin) {
    avatar = normalizeBucket((author.avatar.origin.bucket || '').replace(/\/?$/, '/') + (author.avatar.link || author.avatar.origin.link || ''));
  }
  const text = cleanDesc(author.description || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  TEACHER_BIO_CACHE[t.key] = { avatar, text: text.slice(0, 110) };
  if (avatar) { const img = new Image(); img.decoding='async'; img.fetchPriority='high'; img.src=avatar; }
  const card = document.getElementById('teacher-grid');
  if (card) card.innerHTML = TEACHERS.map(x => teacherCardHtml(x)).join('');
}

// Chuẩn hoá khoá học từ API thô -> cấu trúc gọn dùng trong toàn app
function normalizeCourses(t, rawList) {
  return (rawList || []).map(c => {
    const id = c.id || c._id;
    const title = c.displayedTitle && c.title ? c.title : (c.title || 'Khoá học');
    const price = c.price || {};
    return {
      id: id,
      title: c.title || title,
      subtitle: c.displayedTitle || '',
      thumbnail: normalizeBucket(c.previewImg || c.backgroundImg || ''),
      category: categoryOf(t, c),
      isFree: !!c.isFree,
      priceAfter: price.afterDiscount || 0,
      featured: !!c.featured,
      studentCount: c.studentCount || 0
    };
  }).sort((a, b) => a.title.localeCompare(b.title, 'vi'));
}

// Phân loại khoá học theo danh mục để hiển thị dạng tab.
// Ưu tiên field "subject" (+ "grade") nếu API trả về, nếu không thì suy luận từ tiêu đề.
function categoryOf(t, c) {
  if (c.subject) return c.subject + (c.grade ? ' - Lớp ' + c.grade : '');
  const title = (c.title || '').toUpperCase();
  if (t.key === 'duong') {
    if (title.indexOf('LIVE') === 0) return 'Khoá Live';
    if (title.indexOf('VOD') === 0) return 'Khoá VOD';
    return 'Khác';
  }
  if (title.indexOf('IELTS') > -1 || title.indexOf('LIVE VIP') > -1) return 'IELTS';
  if (title.indexOf('TOEIC') > -1) return 'TOEIC';
  if (title.indexOf('SGK') > -1 || title.indexOf('LỚP 10') > -1 || title.indexOf('LỚP 11') > -1 ||
      title.indexOf('LỚP 12') > -1 || title.indexOf('THPT') > -1 || title.indexOf('2026-2027') > -1 ||
      title.indexOf('CHƯƠNG TRÌNH MỚI') > -1 || title.indexOf('(CTM)') > -1) return 'THPT - Tiếng Anh';
  return 'Tiếng Anh cơ bản';
}

function createNode(node, level) {
  const block = mk('div', 'tree-node');
  const hd = mk('div', `folder-hd lvl${Math.min(level, 5)}-hd`);
  hd.innerHTML = `<span>${esc(node.title || 'Thư mục')}</span>${chevSvg('ch')}`;
  const kids = mk('div', 'kids');
  hd.addEventListener('click', () => {
    const willOpen = !kids.classList.contains('open');
    hd.classList.toggle('open', willOpen);
    kids.classList.toggle('open', willOpen);
  });

  const children = (node.children || []).filter(u => !u.settings?.isDraft);
  children.sort((a, b) => (a.index || 0) - (b.index || 0));
  children.forEach(u => kids.appendChild(mkLeaf(u, level)));

  const childSections = node.childSections || [];
  childSections.sort((a, b) => (a.index || 0) - (b.index || 0));
  childSections.forEach(sub => kids.appendChild(createNode(sub, level + 1)));

  // Đánh dấu nhóm có bài giảng để vẽ vertical line
  if (children.length) kids.classList.add('has-leaves');

  block.appendChild(hd); block.appendChild(kids);
  return block;
}

function mkLeaf(unit, folderLevel) {
  const id = unit.id || unit._id || '', title = unit.title || 'Bài học', type = (unit.type || 'video').toLowerCase();
  const item = mk('div', 'leaf');
  const courseId = COURSE?.id || '';
  const done = isLessonCompleted(courseId, id);
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  item.innerHTML = `<span class="leaf-badge ${badgeClassOf(type)}">${leafIcon(type)}</span><span class="leaf-title">${esc(title)}</span>
    <button class="complete-lesson-btn ${done ? 'done' : ''}" type="button" title="${done ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành'}" aria-label="${done ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành'}">${checkSvg}</button>`;
  if (done) item.classList.add('completed');
  item.dataset.title = title.toLowerCase();
  item.dataset.titleNorm = stripVN(title);
  item.dataset.id = String(id);
  item.querySelector('.complete-lesson-btn').addEventListener('click', e => {
    e.stopPropagation();
    const nowDone = toggleLessonCompleted(COURSE?.id || '', id);
    e.currentTarget.classList.toggle('done', nowDone);
    e.currentTarget.title = nowDone ? 'Bỏ đánh dấu hoàn thành' : 'Đánh dấu hoàn thành';
    e.currentTarget.setAttribute('aria-label', e.currentTarget.title);
    item.classList.toggle('completed', nowDone);
    updateCourseProgressUI(COURSE?.id || '');
  });
  item.addEventListener('click', () => selectLesson(item, id, title));
  ALL_LEAVES.push(item);
  return item;
}

function selectLesson(el, unitId, title) {
  ALL_LEAVES.forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.querySelector('.app')?.classList.add('in-lesson');
  setBreadcrumb([TEACHER?.name || '', COURSE?.title || '', title]);
  setSupportAvailable(false);
  showContent('<div class="state"><div class="spinner"></div><p>Đang tải nội dung bài học...</p></div>');
